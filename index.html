<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《朱德的扁担》朗读打卡</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: linear-gradient(160deg, #fff9ec 0%, #ffeacb 45%, #ffd9a3 100%);
    min-height: 100vh;
    color: #4a3520;
    padding: 18px 14px 60px;
  }
  .app { max-width: 860px; margin: 0 auto; }

  .topbar { text-align: center; margin-bottom: 18px; }
  .topbar h1 {
    font-size: 26px; margin: 0 0 6px;
    color: #b45309; letter-spacing: 1px;
    text-shadow: 0 2px 0 #fff;
  }
  .topbar .sub { margin: 0; font-size: 14px; color: #a17b4e; }

  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .progress-bar {
    flex: 1; height: 14px; border-radius: 999px;
    background: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,.08);
    overflow: hidden;
  }
  #progressFill, #progressFill2 {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #fbbf24, #f59e0b, #ef8b28);
    transition: width .35s ease;
  }
  .progress-text { font-size: 14px; font-weight: 700; color: #b45309; white-space: nowrap; }

  .card {
    background: #fffdf8;
    border-radius: 22px;
    padding: 22px 22px 26px;
    box-shadow: 0 10px 26px rgba(180, 120, 40, .16), 0 2px 0 #fff inset;
    border: 2px solid #ffe6bd;
    animation: pop .35s ease;
  }
  @keyframes pop { from { transform: scale(.97); opacity: .4; } to { transform: scale(1); opacity: 1; } }

  .sentence-text {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "Songti SC", serif;
    font-size: 34px; line-height: 2.7; letter-spacing: 1px;
    color: #3b2a18; word-break: break-word;
  }
  ruby { ruby-position: over; -webkit-ruby-position: over; }
  rt {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 0.4em; color: #d97706; font-weight: 400;
    letter-spacing: 0; line-height: 1.1;
  }

  .timer {
    text-align: center; font-size: 40px; font-weight: 800;
    font-variant-numeric: tabular-nums; color: #0f766e;
    margin: 20px 0 8px; letter-spacing: 2px; text-shadow: 0 2px 0 #fff;
  }
  .timer.run { color: #dc2626; animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .45; } }

  .rec-indicator {
    display: none; justify-content: center; align-items: center;
    gap: 8px; font-size: 14px; font-weight: 700; color: #dc2626;
    margin-bottom: 14px;
  }
  .rec-indicator.on { display: flex; }
  .rec-indicator .dot {
    width: 12px; height: 12px; border-radius: 50%; background: #ef4444;
    animation: recpulse 1s infinite;
  }
  @keyframes recpulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.45); opacity: .4; } }

  .btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .btn {
    border: none; border-radius: 999px; padding: 15px 32px;
    font-size: 18px; font-weight: 800; font-family: inherit;
    cursor: pointer; transition: transform .12s, box-shadow .12s, filter .18s;
    box-shadow: 0 5px 0 rgba(0,0,0,.13); color: #fff;
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.13); }
  .btn:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
  .btn-demo { background: #fff; color: #d97706; border: 2px solid #fbbf24; box-shadow: 0 5px 0 #fde3ae; }
  .btn-challenge { background: linear-gradient(135deg, #34d399, #0ea472); }
  .btn-challenge.running { background: linear-gradient(135deg, #fb7185, #e11d48); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { filter: brightness(1.18); } }
  .btn-next { background: linear-gradient(135deg, #60a5fa, #2563eb); }
  .btn-next:disabled { background: #cbd5e1; }

  .hint {
    text-align: center; font-size: 15px; color: #a16207;
    margin: 12px 0 0; min-height: 22px; line-height: 1.5;
  }

  /* ---------- 评分面板 ---------- */
  .score-panel {
    background: #fff; border-radius: 18px; padding: 16px 18px;
    margin: 0 0 16px; border: 2px solid #ffe6bd;
    box-shadow: 0 8px 20px rgba(180,120,40,.14);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    animation: pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  .score-panel.hidden { display: none; }
  .grade-ring {
    width: 80px; height: 80px; flex: 0 0 80px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 42px; font-weight: 900; color: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 0 26px rgba(251,191,36,.55);
    animation: ringpop .55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes ringpop { 0% { transform: scale(.2) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .grade-S { background: linear-gradient(135deg,#fcd34d,#f59e0b); }
  .grade-A { background: linear-gradient(135deg,#6ee7b7,#10b981); }
  .grade-B { background: linear-gradient(135deg,#93c5fd,#3b82f6); }
  .grade-C { background: linear-gradient(135deg,#c4b5fd,#8b5cf6); }
  .grade-D { background: linear-gradient(135deg,#cbd5e1,#94a3b8); }

  .score-rows { flex: 1; min-width: 210px; }
  .score-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .score-row .lbl { width: 62px; color: #7c5a2e; font-weight: 700; flex: none; }
  .score-row .bar { flex: 1; height: 10px; border-radius: 999px; background: #f1e5cf; overflow: hidden; }
  .score-row .bar i {
    display: block; height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(90deg,#fbbf24,#f97316);
    transition: width .7s cubic-bezier(.34,1.3,.64,1);
  }
  .score-row .num {
    width: 32px; text-align: right; font-weight: 800; color: #b45309;
    flex: none; font-variant-numeric: tabular-nums;
  }
  .score-tip {
    width: 100%; margin: 8px 0 0; font-size: 15px; font-weight: 700;
    color: #b45309; text-align: center; line-height: 1.5;
  }

  /* ---------- 全文挑战 ---------- */
  .full-card h2 { margin: 0 0 6px; font-size: 22px; color: #b45309; text-align: center; }
  .sub2 { text-align: center; margin: 0 0 16px; font-size: 14px; color: #a17b4e; }
  .full-sentence {
    position: relative; margin: 0 0 10px; padding: 8px 44px 8px 10px;
    border-radius: 14px; transition: background .2s;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "Songti SC", serif;
    font-size: 27px; line-height: 2.6; letter-spacing: 1px;
  }
  .full-sentence:hover { background: #fff7e6; }
  .mini-speak {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: #fef3c7; font-size: 16px; line-height: 1;
    transition: transform .15s, background .15s;
  }
  .mini-speak:hover { background: #fde68a; transform: translateY(-50%) scale(1.1); }
  .mini-speak:active { transform: translateY(-50%) scale(.94); }

  /* ---------- 完成页 ---------- */
  .done-card { text-align: center; padding: 34px 22px 40px; }
  .emoji { font-size: 68px; animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .done-card h2 {
    font-size: 44px; margin: 10px 0 6px; color: #e11d48;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(225,29,72,.25); letter-spacing: 3px;
  }
  .big-score {
    font-size: 68px; font-weight: 900; line-height: 1.1;
    background: linear-gradient(135deg,#f59e0b,#e11d48);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 6px 0 2px; letter-spacing: 2px;
  }
  .big-score small { font-size: 24px; -webkit-text-fill-color: #b45309; color: #b45309; }
  .praise { font-size: 26px; font-weight: 800; color: #b45309; margin: 6px 0 18px; letter-spacing: 2px; }
  .time-info { font-size: 16px; color: #7c5a2e; margin-bottom: 22px; }
  .time-info span { font-weight: 800; color: #0f766e; font-size: 20px; }

  #fireworks {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 40; display: none;
  }
  #fireworks.show { display: block; }

  .stage.hidden { display: none; }

  @media (max-width: 600px) {
    .topbar h1 { font-size: 20px; }
    .sentence-text { font-size: 25px; line-height: 2.6; }
    .full-sentence { font-size: 20px; line-height: 2.6; padding-right: 40px; }
    .timer { font-size: 32px; }
    .btn { padding: 13px 22px; font-size: 16px; }
    .done-card h2 { font-size: 34px; }
    .praise { font-size: 20px; }
    .big-score { font-size: 54px; }
    .grade-ring { width: 66px; height: 66px; flex-basis: 66px; font-size: 34px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <h1>📖 《朱德的扁担》朗读打卡</h1>
    <p class="sub">二年级 · 一句一句跟着读，做朗读小达人！</p>
  </div>

  <!-- ========== 逐句跟读 ========== -->
  <section id="stageSentence" class="stage">
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div class="progress-text">第 <span id="curNum">1</span> / 12 句</div>
    </div>

    <div class="card">
      <div class="sentence-text" id="sentenceText"></div>
    </div>

    <div class="timer" id="timerDisplay">00.0 秒</div>
    <div class="rec-indicator" id="recIndicator"><span class="dot"></span>🎙️ 正在录音…</div>

    <!-- 评分结果 -->
    <div class="score-panel hidden" id="scorePanel">
      <div class="grade-ring" id="gradeRing">S</div>
      <div class="score-rows" id="scoreRows"></div>
      <p class="score-tip" id="scoreTip"></p>
    </div>

    <div class="btn-row">
      <button class="btn btn-demo" id="btnDemo">🔊 示范跟读</button>
      <button class="btn btn-challenge" id="btnChallenge">🎤 我来挑战</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-next" id="btnNext" disabled>下一句 →</button>
    </div>
    <p class="hint" id="hint">先听一听示范，再点“我来挑战”开始朗读吧！</p>
  </section>

  <!-- ========== 全文挑战 ========== -->
  <section id="stageFull" class="stage hidden">
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill2" style="width:100%"></div></div>
      <div class="progress-text">12 / 12 句 已完成</div>
    </div>

    <div class="card full-card">
      <h2>📚 全文朗读挑战</h2>
      <p class="sub2">从头到尾完整地读一遍吧！每句都可以点小喇叭听示范～</p>
      <div id="fullText" class="full-text"></div>
    </div>

    <div class="timer" id="fullTimer">00.0 秒</div>
    <div class="rec-indicator" id="fullRecIndicator"><span class="dot"></span>🎙️ 正在录音…</div>

    <div class="score-panel hidden" id="fullScorePanel">
      <div class="grade-ring" id="fullGradeRing">S</div>
      <div class="score-rows" id="fullScoreRows"></div>
      <p class="score-tip" id="fullScoreTip"></p>
    </div>

    <div class="btn-row">
      <button class="btn btn-challenge" id="btnFullChallenge">🎤 我来挑战</button>
    </div>
    <p class="hint" id="fullHint">准备好后，点击“我来挑战”开始全文朗读。</p>
  </section>

  <!-- ========== 完成庆祝 ========== -->
  <section id="stageDone" class="stage hidden">
    <div class="card done-card">
      <div class="emoji">🎉</div>
      <h2>你真棒！</h2>
      <div class="big-score"><span id="finalScore">0</span><small>分</small></div>
      <p class="praise">你是朗读小达人！</p>
      <p class="time-info">全文朗读用时 <span id="finalTime">0</span> 秒</p>
      <button class="btn btn-demo" id="btnAgain">🔄 再来一次</button>
    </div>
  </section>
</div>

<canvas id="fireworks"></canvas>

<script>
/* ============================================================
   一、课文数据
   ============================================================ */
const SENTENCES = [
  '1928 年/nián ， 朱/zhū 德/dé 同/tóng 志/zhì 带/dài 领/lǐng 队/duì 伍/wǔ 到/dào 井/jǐng 冈/gāng 山/shān ， 跟/gēn 毛/máo 泽/zé 东/dōng 同/tóng 志/zhì 会/huì 师/shī 了/le 。',
  '红/hóng 军/jūn 在/zài 山/shān 上/shàng ， 山/shān 下/xià 不/bù 远/yuǎn 处/chù 就/jiù 是/shì 敌/dí 人/rén 。',
  '红/hóng 军/jūn 要/yào 巩/gǒng 固/gù 井/jǐng 冈/gāng 山/shān 根/gēn 据/jù 地/dì ， 粉/fěn 碎/suì 敌/dí 人/rén 的/de 围/wéi 攻/gōng ， 需/xū 要/yào 储/chǔ 备/bèi 足/zú 够/gòu 的/de 粮/liáng 食/shí 。',
  '井/jǐng 冈/gāng 山/shān 上/shàng 生/shēng 产/chǎn 粮/liáng 食/shí 不/bù 多/duō ， 常/cháng 常/cháng 要/yào 抽/chōu 出/chū 一/yī 些/xiē 人/rén 到/dào 茅/máo 坪/píng 去/qù 挑/tiāo 粮/liáng 。',
  '从/cóng 井/jǐng 冈/gāng 山/shān 到/dào 茅/máo 坪/píng ， 来/lái 回/huí 有/yǒu 五/wǔ 六/liù 十/shí 里/lǐ ， 山/shān 高/gāo 路/lù 陡/dǒu ， 非/fēi 常/cháng 难/nán 走/zǒu 。',
  '可/kě 是/shì 每/měi 次/cì 挑/tiāo 粮/liáng ， 大/dà 家/jiā 都/dōu 争/zhēng 着/zhe 去/qù 。',
  '朱/zhū 德/dé 同/tóng 志/zhì 也/yě 跟/gēn 战/zhàn 士/shì 们/men 一/yì 块/kuài 儿/r 去/qù 挑/tiāo 粮/liáng 。',
  '他/tā 穿/chuān 着/zhe 草/cǎo 鞋/xié ， 戴/dài 着/zhe 斗/dǒu 笠/lì ， 挑/tiāo 起/qǐ 粮/liáng 食/shí ， 跟/gēn 大/dà 家/jiā 一/yì 块/kuài 儿/r 爬/pá 山/shān 。',
  '白/bái 天/tiān 挑/tiāo 粮/liáng 爬/pá 山/shān ， 晚/wǎn 上/shang 还/hái 常/cháng 常/cháng 整/zhěng 夜/yè 整/zhěng 夜/yè 地/de 研/yán 究/jiū 怎/zěn 样/yàng 跟/gēn 敌/dí 人/rén 打/dǎ 仗/zhàng 。',
  '大/dà 家/jiā 看/kàn 了/le 心/xīn 疼/téng ， 就/jiù 把/bǎ 他/tā 那/nà 根/gēn 扁/biǎn 担/dan 藏/cáng 了/le 起/qǐ 来/lái 。',
  '不/bù 料/liào ， 朱/zhū 德/dé 同/tóng 志/zhì 又/yòu 找/zhǎo 来/lái 一/yī 根/gēn 扁/biǎn 担/dan ， 写/xiě 上/shàng “ 朱/zhū 德/dé 的/de 扁/biǎn 担/dan ” 五/wǔ 个/gè 字/zì 。',
  '大/dà 家/jiā 见/jiàn 了/le ， 越/yuè 发/fā 敬/jìng 爱/ài 朱/zhū 德/dé 同/tóng 志/zhì ， 不/bù 好/hǎo 意/yì 思/si 再/zài 藏/cáng 他/tā 的/de 扁/biǎn 担/dan 了/le 。'
];

/* ============================================================
   二、通用工具
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function tokenize(str) { return str.split(/\s+/).filter(Boolean); }

function rubify(str) {
  return tokenize(str).map(tok => {
    const i = tok.indexOf('/');
    if (i === -1) return tok;
    return `<ruby>${tok.slice(0, i)}<rt>${tok.slice(i + 1)}</rt></ruby>`;
  }).join('');
}

function plainText(str) {
  return tokenize(str).map(tok => {
    const i = tok.indexOf('/');
    return i === -1 ? tok : tok.slice(0, i);
  }).join('');
}

/* ---- 文本归一化：数字转汉字，只保留汉字/字母 ---- */
const CN_DIGIT = { '0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九' };
function normalizeText(s) {
  s = String(s || '').replace(/[0-9]/g, d => CN_DIGIT[d]);
  return s.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');
}

/* ---- 编辑距离 ---- */
function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = new Array(n + 1), cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    const t = prev; prev = cur; cur = t;
  }
  return prev[n];
}

function accuracyScore(ref, hyp) {
  const r = normalizeText(ref), h = normalizeText(hyp);
  if (!h.length) return 0;
  const d = levenshtein(r, h);
  const denom = Math.max(r.length, h.length, 1);
  const sim = 1 - d / denom;
  return clamp(Math.round(sim * 115), 0, 100);
}

/* ============================================================
   三、语音合成（示范跟读）
   ★ 修改点：示范朗读语速 = 原来的0.82 × 0.8 ≈ 0.66
   ============================================================ */
const SPEECH_RATE = 0.66;   // ← 想再慢可改小（如0.6），想快可改大

let zhVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => v.lang && v.lang.toLowerCase().replace('_','-').startsWith('zh'))
         || vs.find(v => /chinese|中文|普通话|mandarin/i.test(v.name))
         || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let speaking = false;
function speak(text, onEnd) {
  if (!('speechSynthesis' in window)) {
    alert('当前浏览器不支持语音朗读，请使用 Chrome / Edge / Safari 浏览器。');
    onEnd && onEnd(); return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = SPEECH_RATE;     // 0.8倍速示范
  u.pitch = 1.05;
  u.volume = 1;
  if (zhVoice) u.voice = zhVoice;
  let finished = false;
  const done = () => { if (!finished) { finished = true; speaking = false; onEnd && onEnd(); } };
  u.onend = done; u.onerror = done;
  speaking = true;
  speechSynthesis.speak(u);
}

/* ============================================================
   四、麦克风录音 + 声学分析
   ============================================================ */
const SAMPLE_INTERVAL = 0.06;

const Rec = {
  stream: null, audioCtx: null, analyser: null, source: null,
  samples: [], intervalId: null, sampleRate: 48000,
  isRecording: false, startTime: 0, buf: null,

  async start() {
    this.samples = [];
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    this.stream = stream;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.audioCtx = new AC();
      this.sampleRate = this.audioCtx.sampleRate;
      this.source = this.audioCtx.createMediaStreamSource(stream);
      this.analyser = this.audioCtx.createAnalyser();
      this.analyser.fftSize = 1024;
      this.analyser.smoothingTimeConstant = 0.3;
      this.source.connect(this.analyser);
      this.buf = new Float32Array(this.analyser.fftSize);
    } catch (e) {
      stream.getTracks().forEach(t => t.stop());
      this.stream = null;
      throw e;
    }
    this.isRecording = true;
    this.startTime = performance.now();
    this.intervalId = setInterval(() => this._collect(), SAMPLE_INTERVAL * 1000);
  },

  _collect() {
    if (!this.analyser || !this.buf) return;
    this.analyser.getFloatTimeDomainData(this.buf);
    let rms = 0;
    for (let i = 0; i < this.buf.length; i++) rms += this.buf[i] * this.buf[i];
    rms = Math.sqrt(rms / this.buf.length);
    let pitch = 0;
    if (rms > 0.012) pitch = computePitch(this.buf, this.sampleRate);
    this.samples.push({ rms, pitch });
  },

  stop() {
    this.isRecording = false;
    if (this.intervalId) { clearInterval(this.intervalId); this.intervalId = null; }
    const duration = (performance.now() - this.startTime) / 1000;
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.audioCtx) { try { this.audioCtx.close(); } catch (e) {} }
    const samples = this.samples.slice();
    this.stream = null; this.audioCtx = null;
    this.analyser = null; this.source = null; this.buf = null;
    return { duration, samples };
  }
};

function computePitch(buf, sr) {
  const size = buf.length;
  let rms = 0;
  for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / size);
  if (rms < 0.01) return 0;

  const minLag = Math.max(2, Math.floor(sr / 500));
  const maxLag = Math.min(Math.floor(sr / 70), size - 2);
  if (maxLag <= minLag) return 0;

  const corr = new Float32Array(maxLag + 2);
  for (let lag = minLag; lag <= maxLag; lag++) {
    let sum = 0;
    const n = size - lag;
    for (let i = 0; i < n; i += 2) sum += buf[i] * buf[i + lag];
    corr[lag] = sum;
  }
  let bestLag = -1, bestVal = 0;
  for (let lag = minLag + 1; lag < maxLag; lag++) {
    if (corr[lag] > corr[lag - 1] && corr[lag] >= corr[lag + 1] && corr[lag] > bestVal) {
      bestVal = corr[lag]; bestLag = lag;
    }
  }
  if (bestLag < 0) return 0;
  const y1 = corr[bestLag - 1], y2 = corr[bestLag], y3 = corr[bestLag + 1];
  const denom = (y1 + y3 - 2 * y2);
  const shift = Math.abs(denom) > 1e-9 ? 0.5 * (y1 - y3) / denom : 0;
  const period = bestLag + shift;
  if (period <= 0) return 0;
  const f = sr / period;
  return (f >= 70 && f <= 1000) ? f : 0;
}

function analyzeVoice(samples) {
  if (!samples || samples.length < 4) return { ok: false };

  const rmsArr = samples.map(s => s.rms);
  const maxRms = Math.max.apply(null, rmsArr);
  if (maxRms < 0.02) return { ok: false, silent: true };

  const noise = Math.max(0.006, maxRms * 0.13);
  const voicedFlags = rmsArr.map(r => r > noise);

  const runs = [];
  let start = 0;
  for (let i = 1; i <= voicedFlags.length; i++) {
    if (i === voicedFlags.length || voicedFlags[i] !== voicedFlags[start]) {
      runs.push({ voiced: voicedFlags[start], len: (i - start) * SAMPLE_INTERVAL });
      start = i;
    }
  }
  if (runs.length && !runs[0].voiced) runs.shift();
  if (runs.length && !runs[runs.length - 1].voiced) runs.pop();

  let voicedDur = 0;
  const pauseLens = [];
  runs.forEach(r => {
    if (r.voiced) voicedDur += r.len;
    else if (r.len >= 0.22) pauseLens.push(r.len);
  });
  const pauseDur = pauseLens.reduce((a, b) => a + b, 0);
  const totalDur = Math.max(samples.length * SAMPLE_INTERVAL, 0.1);
  const pauseRatio = pauseDur / totalDur;
  const maxPause = pauseLens.length ? Math.max.apply(null, pauseLens) : 0;

  const pitches = samples.map(s => s.pitch).filter(p => p > 60 && p < 800);
  let pitchMean = 0, pitchStd = 0;
  if (pitches.length > 4) {
    pitchMean = pitches.reduce((a, b) => a + b, 0) / pitches.length;
    pitchStd = Math.sqrt(pitches.reduce((a, b) => a + (b - pitchMean) ** 2, 0) / pitches.length);
  }

  const vr = samples.filter((s, i) => voicedFlags[i]).map(s => s.rms);
  const rmsMean = vr.length ? vr.reduce((a, b) => a + b, 0) / vr.length : 0;
  const rmsStd = vr.length ? Math.sqrt(vr.reduce((a, b) => a + (b - rmsMean) ** 2, 0) / vr.length) : 0;

  return {
    ok: true, voicedDur, pauseRatio, pauseCount: pauseLens.length,
    maxPause, pitchMean, pitchStd, rmsMean, rmsStd, totalDur
  };
}

function scoreFromVoice(feat, charCount, accScore) {
  let rhythm = 100;
  const pr = feat.pauseRatio;
  if (pr < 0.08) rhythm -= (0.08 - pr) * 260;
  else if (pr > 0.45) rhythm -= (pr - 0.45) * 180;
  if (feat.maxPause > 1.1) rhythm -= Math.min(22, (feat.maxPause - 1.1) * 22);
  const expectPauses = Math.max(1, charCount / 14);
  if (feat.pauseCount > expectPauses * 3 + 3) rhythm -= 8;
  rhythm = clamp(rhythm, 0, 100);

  let fluency = 100;
  const cps = charCount / Math.max(feat.voicedDur, 0.25);
  if (cps < 2.0) fluency -= (2.0 - cps) * 20;
  else if (cps > 5.5) fluency -= (cps - 5.5) * 12;
  if (feat.maxPause > 0.9) fluency -= Math.min(18, (feat.maxPause - 0.9) * 18);
  fluency = clamp(fluency, 0, 100);

  let tone = 72;
  if (feat.pitchMean > 0 && feat.pitchStd > 0) {
    const cv = feat.pitchStd / feat.pitchMean;
    if (cv < 0.06) tone -= (0.06 - cv) * 380;
    else if (cv > 0.40) tone -= (cv - 0.40) * 100;
    else tone += 22;
  }
  if (feat.rmsMean > 0 && feat.rmsStd > 0) {
    const rcv = feat.rmsStd / feat.rmsMean;
    if (rcv < 0.18) tone -= (0.18 - rcv) * 70;
    else if (rcv > 0.90) tone -= (rcv - 0.90) * 30;
  }
  tone = clamp(tone, 45, 100);

  let total;
  if (accScore == null) total = rhythm * 0.36 + fluency * 0.32 + tone * 0.32;
  else total = accScore * 0.50 + rhythm * 0.20 + fluency * 0.15 + tone * 0.15;

  return {
    acc: accScore,
    rhythm: Math.round(rhythm),
    fluency: Math.round(fluency),
    tone: Math.round(tone),
    total: clamp(Math.round(total), 0, 100)
  };
}

function gradeOf(t) {
  if (t >= 86) return 'S';
  if (t >= 76) return 'A';
  if (t >= 66) return 'B';
  if (t >= 56) return 'C';
  return 'D';
}

   五、语音识别
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recogFinal = '';
let recogActive = false;

if (SR) {
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
}

function startRecognition() {
  if (!recognition) return;
  recogFinal = '';
  recogActive = true;
  recognition.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) recogFinal += res[0].transcript;
    }
  };
  recognition.onerror = (e) => { console.warn('语音识别：', e.error); };
  recognition.onend = () => {
    if (recogActive) { try { recognition.start(); } catch (err) {} }
  };
  try { recognition.start(); } catch (e) {}
}

function stopRecognitionAndWait() {
  return new Promise(resolve => {
    if (!recognition || !recogActive) { resolve(recogFinal); return; }
    recogActive = false;
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(recogFinal);
    };
    const timer = setTimeout(finish, 900);
    recognition.onend = finish;
    try { recognition.stop(); } catch (e) { finish(); }
  });
}

/* ============================================================
   六、音频（BGM 合成）
   ============================================================ */
let audioCtx = null, masterGain = null;
function ensureAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
  return audioCtx;
}

const N = {
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77,C6:1046.50
};

const MELODY = [
  [N.C5,.38],[N.C5,.38],[N.G5,.38],[N.G5,.38],[N.A5,.38],[N.A5,.38],[N.G5,.76],
  [N.F5,.38],[N.F5,.38],[N.E5,.38],[N.E5,.38],[N.D5,.38],[N.D5,.38],[N.C5,.76],
  [N.G5,.38],[N.G5,.38],[N.F5,.38],[N.F5,.38],[N.E5,.38],[N.E5,.38],[N.D5,.76],
  [N.G5,.38],[N.G5,.38],[N.F5,.38],[N.F5,.38],[N.E5,.38],[N.E5,.38],[N.D5,.76],
  [N.C5,.38],[N.C5,.38],[N.G5,.38],[N.G5,.38],[N.A5,.38],[N.A5,.38],[N.G5,.76],
  [N.F5,.38],[N.F5,.38],[N.E5,.38],[N.E5,.38],[N.D5,.38],[N.D5,.38],[N.C5,.76]
];

let bgmTimer = null, bgmOn = false;

function playNote(freq, start, dur) {
  const ac = audioCtx;
  if (!ac) return;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.linearRampToValueAtTime(0.22, start + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur * 0.92);
  osc.connect(g); g.connect(masterGain);
  osc.start(start); osc.stop(start + dur + 0.02);
}

function startBGM() {
  const ac = ensureAudio();
  if (!ac || bgmOn) return;
  bgmOn = true;
  let nextStart = ac.currentTime + 0.15;
  const loop = () => {
    if (!bgmOn) return;
    let t = nextStart;
    for (const [f, d] of MELODY) { playNote(f, t, d); t += d; }
    const endTime = t;
    const delay = Math.max((endTime - audioCtx.currentTime - 0.35) * 1000, 120);
    bgmTimer = setTimeout(() => {
      if (!bgmOn) return;
      nextStart = Math.max(audioCtx.currentTime + 0.08, endTime - 0.25);
      loop();
    }, delay);
  };
  loop();
}

function stopBGM() {
  bgmOn = false;
  if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; masterGain = null; }
}

const TOTAL = SENTENCES.length;
let curIdx = 0;
let challengeState = 'idle';

const $sentenceText = document.getElementById('sentenceText');
const $curNum = document.getElementById('curNum');
const $progressFill = document.getElementById('progressFill');
const $timerDisplay = document.getElementById('timerDisplay');
const $btnDemo = document.getElementById('btnDemo');

const $gradeRing = document.getElementById('gradeRing');
const $scoreRows = document.getElementById('scoreRows');
const $scoreTip = document.getElementById('scoreTip');

const fmt = s => s.toFixed(1) + ' 秒';
const updateTimer = s => { $timerDisplay.textContent = fmt(s); };

function renderSentence() {
  $sentenceText.innerHTML = rubify(SENTENCES[curIdx]);
  $curNum.textContent = curIdx + 1;
  $progressFill.style.width = (curIdx / TOTAL * 100) + '%';

  challengeState = 'idle';
  micOK = false;
  updateTimer(0);
  $timerDisplay.classList.remove('run');
  $recIndicator.classList.remove('on');
  $scorePanel.classList.add('hidden');
  $btnChallenge.textContent = '🎤 我来挑战';
  $btnChallenge.classList.remove('running');
  $btnChallenge.disabled = false;
  $btnDemo.disabled = false;
  $btnNext.disabled = true;
  $btnNext.textContent = (curIdx === TOTAL - 1) ? '🏁 进入全文挑战' : '下一句 →';
  $hint.textContent = '先听一听示范，再点“我来挑战”开始录音朗读吧！';
}

$btnDemo.addEventListener('click', () => {
  if (speaking || challengeState === 'running' || challengeState === 'scoring') return;
  const old = $btnDemo.textContent;
  $btnDemo.disabled = true;
  $btnDemo.textContent = '🔈 朗读中…';
  speak(plainText(SENTENCES[curIdx]), () => {
    $btnDemo.disabled = false;
    $btnDemo.textContent = old;
  });
});

function renderScorePanel(target, result, isFull) {
  const grade = gradeOf(result.total);
  target.gradeEl.className = 'grade-ring grade-' + grade;
  target.gradeEl.textContent = grade;

  const rows = [];
  if (result.acc != null) rows.push(['读音正确', result.acc]);
  rows.push(['节奏停顿', result.rhythm]);
  rows.push(['流畅度', result.fluency]);
  rows.push(['语气感情', result.tone]);

  target.rowsEl.innerHTML = rows.map(([label, val]) => `
    <div class="score-row">
      <span class="lbl">${label}</span>
      <span class="bar"><i style="width:0%"></i></span>
      <span class="num">${val}</span>
    </div>`).join('');

  target.tipEl.textContent = isFull
    ? (FULL_TIPS[grade] || '')
    : (TIPS[grade] || '');

  target.panelEl.classList.remove('hidden');

  requestAnimationFrame(() => {
    const bars = target.rowsEl.querySelectorAll('.bar i');
    rows.forEach(([, val], i) => { if (bars[i]) bars[i].style.width = val + '%'; });
  });
}

async function startSentenceChallenge() {
  ensureAudio();
  $scorePanel.classList.add('hidden');
  $btnNext.disabled = true;
  $btnDemo.disabled = true;
  $btnChallenge.disabled = false;
  challengeState = 'running';

  $btnChallenge.textContent = '⏹ 我读完了';
  $btnChallenge.classList.add('running');
  $timerDisplay.classList.add('run');
  updateTimer(0);
  tStart = performance.now();
  clearInterval(tInterval);
  tInterval = setInterval(() => updateTimer((performance.now() - tStart) / 1000), 100);

  micOK = false;
  try {
    await Rec.start();
    micOK = true;
  } catch (err) {
    console.warn('麦克风不可用：', err);
  }

  if (micOK) {
    startRecognition();
    $recIndicator.classList.add('on');
    $hint.textContent = '🎙️ 正在录音，大声朗读吧！读完后点“我读完了”。';
  } else {
    $hint.textContent = '没有拿到麦克风权限，本轮只计时不评分。读完点“我读完了”。';
  }
}

async function stopSentenceChallenge() {
  clearInterval(tInterval); tInterval = null;
  const elapsed = (performance.now() - tStart) / 1000;
  updateTimer(elapsed);
  $timerDisplay.classList.remove('run');
  $recIndicator.classList.remove('on');

  challengeState = 'scoring';
  $btnChallenge.disabled = true;
  $btnChallenge.textContent = '⏳ 评分中…';
  $hint.textContent = '正在听听你读得怎么样……';

  const asrText = await stopRecognitionAndWait();
  let samples = null;
  if (micOK) {
    const r = Rec.stop();
    samples = r.samples;
  }

  await sleep(380);

  const ref = plainText(SENTENCES[curIdx]);
  const charCount = Math.max(normalizeText(ref).length, 1);
  const acc = (asrText && asrText.trim()) ? accuracyScore(ref, asrText) : null;
  const feat = samples ? analyzeVoice(samples) : null;

  challengeState = 'done';
  $btnChallenge.disabled = false;
  $btnChallenge.classList.remove('running');
  $btnChallenge.textContent = '🔄 再挑战一次';
  $btnDemo.disabled = false;

  if (feat && feat.ok) {
    const result = scoreFromVoice(feat, charCount, acc);
    renderScorePanel(
      { panelEl: $scorePanel, gradeEl: $gradeRing, rowsEl: $scoreRows, tipEl: $scoreTip },
      result, false
    );
    $hint.textContent = `用时 ${fmt(elapsed)}，本句等级：${gradeOf(result.total)} 级`;
    $btnNext.disabled = false;
  } else if (!micOK) {
    $scorePanel.classList.add('hidden');
    $hint.textContent = `用时 ${fmt(elapsed)}。本轮没有录音，下次记得允许麦克风哦～`;
    $btnNext.disabled = false;
  } else {
    $scorePanel.classList.add('hidden');
    $hint.textContent = `用时 ${fmt(elapsed)}。好像没听到声音，再试一次吧！`;
    $btnNext.disabled = false;
  }
}

$btnChallenge.addEventListener('click', async () => {
  if (challengeState === 'running') {
    await stopSentenceChallenge();
  } else if (challengeState === 'idle' || challengeState === 'done') {
    await startSentenceChallenge();
  }
});

});

  }

  $btnFullChallenge.disabled = false;
  $btnFullChallenge.textContent = '🎤 我来挑战';
  $btnFullChallenge.classList.remove('running');

  if (hasResult) {
    setTimeout(() => celebrate(elapsed, finalScore), 1600);
  }
}

$btnFullChallenge.addEventListener('click', async () => {
  if (!fullRunning) await startFullChallenge();
  else await stopFullChallenge();
});

/* ============================================================
   十、庆祝页 + 烟花 + BGM
   ============================================================ */
const $finalTime = document.getElementById('finalTime');
const $finalScoreEl = document.getElementById('finalScore');
const canvas = document.getElementById('fireworks');
const fwCtx = canvas.getContext('2d');
let fwParts = [], fwRunning = false, fwRAF = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { if (fwRunning) resizeCanvas(); });

function burst(x, y, hue) {
  const count = 55 + Math.floor(Math.random() * 45);
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * 5.5 + 1.2;
    fwParts.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      decay: 0.007 + Math.random() * 0.013,
      hue: hue + (Math.random() * 50 - 25),
      size: 1.4 + Math.random() * 2.2
    });
  }
}

function startFireworks() {
  resizeCanvas();
  fwParts = [];
  fwRunning = true;
  let last = performance.now(), acc = 0;
  burst(canvas.width * 0.5, canvas.height * 0.35, Math.random() * 360);

  function loop(now) {
    if (!fwRunning) return;
    const dt = Math.min(now - last, 60);
    last = now;
    acc += dt;
    if (acc > 620) {
      acc = 0;
      burst(
        canvas.width * (0.12 + Math.random() * 0.76),
        canvas.height * (0.12 + Math.random() * 0.5),
        Math.random() * 360
      );
    }

    fwCtx.globalCompositeOperation = 'destination-out';
    fwCtx.fillStyle = 'rgba(0,0,0,0.17)';
    fwCtx.fillRect(0, 0, canvas.width, canvas.height);

    fwCtx.globalCompositeOperation = 'lighter';
    for (let i = fwParts.length - 1; i >= 0; i--) {
      const p = fwParts[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.05;
      p.vx *= 0.988; p.vy *= 0.988;
      p.life -= p.decay;
      if (p.life <= 0) { fwParts.splice(i, 1); continue; }
      fwCtx.fillStyle = `hsla(${p.hue},100%,62%,${p.life})`;
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, p.size * p.life + 0.4, 0, Math.PI * 2);
      fwCtx.fill();
    }
    fwRAF = requestAnimationFrame(loop);
  }
  fwRAF = requestAnimationFrame(loop);
}

function stopFireworks() {
  fwRunning = false;
  if (fwRAF) cancelAnimationFrame(fwRAF);
  fwRAF = null;
  fwParts = [];
  fwCtx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.classList.remove('show');
}

function celebrate(seconds, score) {
  $finalTime.textContent = seconds.toFixed(1);
  $finalScoreEl.textContent = score;
  showStage('done');
  canvas.classList.add('show');
  startFireworks();
  startBGM();
}

document.getElementById('btnAgain').addEventListener('click', () => {
  stopFireworks();
  stopBGM();
  if ('speechSynthesis' in window) speechSynthesis.cancel();

  curIdx = 0;
  fullRunning = false;
  fullMicOK = false;
  clearInterval(fullInterval); fullInterval = null;

  $fullTimer.textContent = '0.0 秒';
  $fullTimer.classList.remove('run');
  $fullRecIndicator.classList.remove('on');
  $fullScorePanel.classList.add('hidden');
  $btnFullChallenge.textContent = '🎤 我来挑战';
  $btnFullChallenge.classList.remove('running');
  $btnFullChallenge.disabled = false;
  $fullHint.textContent = '准备好后，点击“我来挑战”开始全文朗读。';

  showStage('sentence');
  renderSentence();
});

   十一、初始化
   ============================================================ */
renderSentence();
