<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>朱德的扁担 · 朗读跟读打卡</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  :root {
    --ink: #2B2D42;
    --orange: #FF8A3D;
    --yellow: #FFD43B;
    --blue: #4DABF7;
    --green: #51CF66;
    --red: #FF6B6B;
    --purple: #CC5DE8;
  }

  body {
    font-family: "Yuanti SC", "YouYuan", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #A5D8FF 0%, #D0EBFF 30%, #FFF4E0 70%, #FFE8CC 100%);
    min-height: 100vh;
    color: var(--ink);
    padding: 14px 14px 46px;
    overflow-x: hidden;
    position: relative;
  }

  /* ================= 卡通背景装饰 ================= */
  .sky-deco {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .sun {
    position: absolute;
    top: -34px; right: -34px;
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #FFF3BF, #FFD43B 62%, #FFA94D);
    box-shadow: 0 0 44px rgba(255,196,59,.75);
    animation: sunPulse 5s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 40px;
    opacity: .92;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }
  .c1 { width: 100px; height: 36px; top: 8%; left: -120px; animation: drift 36s linear infinite; }
  .c1::before { width: 50px; height: 50px; top: -24px; left: 14px; }
  .c1::after  { width: 36px; height: 36px; top: -16px; right: 16px; }
  .c2 { width: 76px; height: 28px; top: 28%; left: -100px; animation: drift 52s linear infinite; animation-delay: -14s; }
  .c2::before { width: 40px; height: 40px; top: -20px; left: 10px; }
  .c2::after  { width: 28px; height: 28px; top: -12px; right: 12px; }
  .c3 { width: 120px; height: 42px; top: 62%; left: -160px; animation: drift 64s linear infinite; animation-delay: -30s; }
  .c3::before { width: 60px; height: 60px; top: -30px; left: 18px; }
  .c3::after  { width: 44px; height: 44px; top: -20px; right: 20px; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 320px)); }
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.6);
    animation: floatUp 14s linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(.7); opacity: 0; }
    20%  { opacity: .8; }
    100% { transform: translateY(-105vh) scale(1.15); opacity: 0; }
  }

  /* ================= 标题 ================= */
  .title-bar { text-align: center; margin: 6px 0 16px; position: relative; z-index: 1; }
  .title-bar h1 {
    display: inline-block;
    font-size: 25px;
    margin: 0 0 6px;
    color: #fff;
    letter-spacing: 2px;
    padding: 10px 26px;
    border-radius: 999px;
    background: linear-gradient(135deg, #FF9F43, #FF6B35);
    border: 3px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink);
    text-shadow: 0 2px 0 rgba(0,0,0,.18);
    animation: titleBob 3s ease-in-out infinite;
  }
  @keyframes titleBob {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-5px) rotate(1deg); }
  }
  .title-bar .sub {
    font-size: 13px;
    color: #5C6B8A;
    letter-spacing: 1px;
    font-weight: 700;
  }

  /* ================= 卡片 ================= */
  .card {
    background: #fff;
    border-radius: 26px;
    border: 3px solid var(--ink);
    box-shadow: 0 8px 0 var(--ink), 0 16px 26px rgba(43,45,66,.16);
    padding: 26px 16px 20px;
    margin: 0 auto 20px;
    max-width: 760px;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 10px;
    background: linear-gradient(90deg, #FFD43B, #FF922B, #FF6B6B, #CC5DE8, #4DABF7, #51CF66);
  }

  /* ================= 关卡头 ================= */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .badge {
    color: #fff;
    font-size: 14px;
    font-weight: 900;
    padding: 7px 16px;
    border-radius: 999px;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #FFC078, #F76707);
    border: 3px solid var(--ink);
    box-shadow: 0 3px 0 var(--ink);
  }
  .badge.blue { background: linear-gradient(135deg, #74C0FC, #1C7ED6); }

  .counter {
    font-size: 15px;
    color: var(--ink);
    font-weight: 900;
    background: #FFF3BF;
    padding: 6px 14px;
    border-radius: 999px;
    border: 3px solid var(--ink);
  }
  .counter b { color: #F76707; font-size: 19px; }

  .timer {
    font-family: "Courier New", monospace;
    font-size: 21px;
    font-weight: 900;
    color: #E03131;
    background: #FFF5F5;
    padding: 5px 16px;
    border-radius: 999px;
    border: 3px solid var(--ink);
    box-shadow: 0 3px 0 var(--ink);
    letter-spacing: 1px;
  }
  .timer.recording { animation: blink 1s infinite; }
  @keyframes blink {
    0%,100% { background: #FFF5F5; }
    50% { background: #FFC9C9; }
  }

  /* ================= 星星进度 ================= */
  .stars {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin: 0 0 12px;
  }
  .star {
    font-size: 17px;
    line-height: 1;
    opacity: .35;
    transition: all .35s;
  }
  .star.done, .star.now { opacity: 1; }
  .star.now { animation: starBounce 1.1s ease-in-out infinite; }
  @keyframes starBounce {
    0%,100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.3) rotate(10deg); }
  }

  /* ================= 进度条 ================= */
  .progress-track {
    height: 16px;
    background: #E9ECEF;
    border-radius: 999px;
    overflow: hidden;
    border: 3px solid var(--ink);
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: repeating-linear-gradient(45deg, #69DB7C 0 10px, #51CF66 10px 20px);
    transition: width .45s cubic-bezier(.4,1.4,.5,1);
  }

  /* ================= 句子气泡 ================= */
  .sentence-box {
    background: #FFFDF5;
    border: 3px dashed var(--yellow);
    border-radius: 22px;
    padding: 8px 14px;
    margin: 4px 0 6px;
  }
  .sentence {
    font-size: 30px;
    line-height: 2.15;
    text-align: center;
    margin: 6px 0;
    color: #212529;
    font-weight: 900;
    word-break: break-word;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2px;
  }
  ruby { ruby-align: center; }
  rt {
    font-size: 0.42em;
    color: #F76707;
    font-weight: 700;
    letter-spacing: .02em;
    font-family: "Arial", sans-serif;
  }
  .punc { color: #495057; font-weight: 700; }

  /* ================= 按钮（3D 卡通） ================= */
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .btn {
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-size: 17px;
    font-weight: 900;
    padding: 12px 24px;
    cursor: pointer;
    font-family: inherit;
    color: #fff;
    letter-spacing: 1px;
    transition: transform .1s, box-shadow .1s, filter .15s;
    box-shadow: 0 6px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.45);
    text-shadow: 0 2px 0 rgba(0,0,0,.15);
    white-space: nowrap;
  }
  .btn:active:not(:disabled) {
    transform: translateY(5px);
    box-shadow: 0 1px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.45);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-blue   { background: linear-gradient(180deg, #74C0FC, #1C7ED6); }
  .btn-green  { background: linear-gradient(180deg, #8CE99A, #2F9E44); }
  .btn-red    { background: linear-gradient(180deg, #FF8787, #E03131); }
  .btn-orange { background: linear-gradient(180deg, #FFC078, #F76707); }
  .btn-small { font-size: 14px; padding: 9px 18px; box-shadow: 0 4px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.45); }

  /* 挑战按钮呼吸光晕 */
  .btn-orange { animation: glowPulse 2.2s infinite; }
  @keyframes glowPulse {
    0%,100% { box-shadow: 0 6px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.45), 0 0 0 0 rgba(255,146,43,.65); }
    50%     { box-shadow: 0 6px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.45), 0 0 0 13px rgba(255,146,43,0); }
  }

  .btn.playing { animation: pulseBtn .9s infinite; }
  @keyframes pulseBtn {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .hint {
    text-align: center;
    font-size: 14px;
    color: #7A869A;
    margin-top: 16px;
    min-height: 20px;
    font-weight: 700;
    transition: color .3s;
  }
  .hint.ok { color: #2F9E44; }

  /* ================= 全文区 ================= */
  .fulltext {
    max-height: 44vh;
    overflow-y: auto;
    padding: 8px;
    border-radius: 18px;
    background: #FDFDFF;
    border: 3px dashed #A5D8FF;
  }
  .full-line {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 8px;
    border-radius: 14px;
    transition: background .3s;
  }
  .full-line:hover { background: #F1F9FF; }
  .full-line.highlight { background: #FFF3BF; }
  .full-line .fs-text {
    flex: 1;
    font-size: 19px;
    line-height: 2.2;
    color: #343A40;
    font-weight: 700;
  }
  .mini-play {
    flex: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: linear-gradient(180deg, #A5D8FF, #4DABF7);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform .1s;
    margin-top: 2px;
  }
  .mini-play:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

  .back-link {
    display: inline-block;
    border: 3px solid var(--ink);
    background: #fff;
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 900;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 0 var(--ink);
    margin-bottom: 12px;
  }
  .back-link:active { transform: translateY(3px); box-shadow: none; }

  /* ================= 弹窗 ================= */
  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 18px;
  }
  .modal.show { display: flex; }
  #fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(8, 12, 34, .86);
  }
  .result-card {
    position: relative;
    z-index: 2;
    background: linear-gradient(180deg, #FFFFFF, #FFF9EF);
    border-radius: 28px;
    border: 4px solid var(--ink);
    padding: 26px 22px 22px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 10px 0 var(--ink), 0 26px 60px rgba(0,0,0,.55);
    animation: pop .55s cubic-bezier(.2,1.6,.5,1);
  }
  @keyframes pop {
    0% { transform: scale(.5) rotate(-6deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .grade {
    font-size: 78px;
    font-weight: 900;
    line-height: 1;
    font-family: "Arial Black", Arial, sans-serif;
    background: linear-gradient(135deg, #FFD43B, #FF922B, #F03E3E);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 5px 0 rgba(43,45,66,.9));
    animation: gradePop .8s ease;
  }
  @keyframes gradePop {
    0% { transform: scale(0) rotate(-30deg); }
    70% { transform: scale(1.25) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .grade-word {
    font-size: 15px;
    color: #7A869A;
    letter-spacing: 4px;
    margin-top: 4px;
    font-weight: 900;
  }
  .praise {
    font-size: 26px;
    font-weight: 900;
    color: #E8590C;
    margin: 14px 0 4px;
    letter-spacing: 2px;
    animation: wave 1.6s infinite;
  }
  .praise2 {
    font-size: 19px;
    font-weight: 900;
    color: #1C7ED6;
    letter-spacing: 1px;
  }
  @keyframes wave {
    0%,100% { transform: rotate(-2deg) scale(1); }
    50% { transform: rotate(2deg) scale(1.05); }
  }
  .scores {
    margin: 18px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #495057;
    font-weight: 700;
  }
  .score-row .lbl { width: 84px; text-align: right; flex: none; font-weight: 900; }
  .score-bar {
    flex: 1;
    height: 16px;
    background: #E9ECEF;
    border-radius: 999px;
    overflow: hidden;
    border: 2px solid var(--ink);
  }
  .score-bar > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    transition: width 1s cubic-bezier(.3,1.3,.5,1);
  }
  .score-row .val { width: 56px; flex: none; font-weight: 900; color: #E8590C; font-size: 14px; }
  .total-line {
    margin-top: 14px;
    font-size: 16px;
    color: #495057;
    font-weight: 900;
  }
  .total-line b { color: #E03131; font-size: 24px; }

  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .mute-btn {
    position: fixed;
    right: 14px; top: 14px;
    z-index: 3;
    border: 3px solid var(--ink);
    background: #fff;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    font-weight: 900;
    box-shadow: 0 3px 0 var(--ink);
  }

  /* ================= 屏幕切换 ================= */
  .screen { display: none; position: relative; z-index: 1; }
  .screen.active { display: block; animation: fadeIn .45s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .mic-warn {
    text-align: center;
    font-size: 13px;
    color: #E03131;
    background: #FFF5F5;
    border: 2px dashed #FFA8A8;
    border-radius: 14px;
    padding: 8px 12px;
    margin-top: 12px;
    display: none;
    font-weight: 700;
  }
  .mic-warn.show { display: block; }

  @media (max-width: 520px) {
    .sentence { font-size: 23px; line-height: 2.2; }
    .full-line .fs-text { font-size: 16px; }
    .btn { font-size: 14px; padding: 10px 14px; }
    .btn-small { font-size: 13px; padding: 8px 14px; }
    .title-bar h1 { font-size: 19px; padding: 8px 18px; }
    .grade { font-size: 64px; }
    .star { font-size: 15px; }
    .card { padding: 24px 12px 16px; }
  }
</style>
</head>
<body>

<!-- 卡通背景 -->
<div class="sky-deco">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="bubble" style="width:16px;height:16px;left:12%;bottom:-30px;animation-delay:0s"></div>
  <div class="bubble" style="width:10px;height:10px;left:32%;bottom:-30px;animation-delay:-4s"></div>
  <div class="bubble" style="width:22px;height:22px;left:58%;bottom:-30px;animation-delay:-8s"></div>
  <div class="bubble" style="width:13px;height:13px;left:80%;bottom:-30px;animation-delay:-2s"></div>
  <div class="bubble" style="width:18px;height:18px;left:92%;bottom:-30px;animation-delay:-11s"></div>
</div>

<div class="title-bar">
  <h1>🍊 朱德的扁担 · 朗读打卡 🍊</h1>
  <div class="sub">二年级语文 · 跟读闯关小游戏</div>
</div>

<!-- ================= 第一关：逐句跟读 ================= -->
<section id="practice" class="screen active">
  <div class="card">
    <div class="bar">
      <span class="badge">🎯 第一关 · 逐句跟读</span>
      <span class="counter">第 <b id="curIdx">1</b> / 12 句</span>
    </div>

    <div class="stars" id="stars"></div>
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>

    <div class="sentence-box">
      <p class="sentence" id="sentenceText"></p>
    </div>

    <div class="controls">
      <button id="demoBtn" class="btn btn-blue">🔊 示范跟读</button>
      <button id="nextBtn" class="btn btn-green">➡️ 下一句</button>
      <button id="goChallengeBtn" class="btn btn-orange">🚀 我来挑战</button>
    </div>
    <p class="hint" id="hint">点「示范跟读」听一听，或点「下一句」继续～ 全部读完就能挑战全文啦！</p>
  </div>
</section>

<!-- ================= 第二关：全文挑战 ================= -->
<section id="challenge" class="screen">
  <div class="card">
    <button class="back-link" id="backToPractice">← 返回跟读</button>
    <div class="bar">
      <span class="badge blue">🏆 第二关 · 全文朗读挑战</span>
      <span class="timer" id="timer">00:00</span>
    </div>
    <div class="fulltext" id="fullText"></div>

    <div class="controls">
      <button id="recordBtn" class="btn btn-red">🎤 我来挑战</button>
      <button id="stopBtn" class="btn btn-orange" disabled>⏹ 停止录音</button>
    </div>
    <p class="hint" id="chHint">准备好了吗？点击「我来挑战」，从第一句开始大声朗读吧！</p>
    <div class="mic-warn" id="micWarn">⚠️ 没有检测到麦克风，将根据朗读时长为你评分～</div>
  </div>
</section>

<!-- ================= 结果弹窗 ================= -->
<div class="modal" id="resultModal">
  <canvas id="fireworks"></canvas>
  <button class="mute-btn" id="muteBtn">🔇 关闭音乐</button>
  <div class="result-card">
    <div class="grade" id="grade">S</div>
    <div class="grade-word" id="gradeWord">超级棒</div>
    <div class="praise">你真棒！🎉</div>
    <div class="praise2">你是朗读小达人 ⭐</div>

    <div class="scores">
      <div class="score-row">
        <span class="lbl">发音正确率</span>
        <span class="score-bar"><i id="bar1" style="background:linear-gradient(90deg,#69DB7C,#2F9E44)"></i></span>
        <span class="val" id="val1">优秀</span>
      </div>
      <div class="score-row">
        <span class="lbl">朗读流畅度</span>
        <span class="score-bar"><i id="bar2" style="background:linear-gradient(90deg,#74C0FC,#1C7ED6)"></i></span>
        <span class="val" id="val2">优秀</span>
      </div>
      <div class="score-row">
        <span class="lbl">节奏情感</span>
        <span class="score-bar"><i id="bar3" style="background:linear-gradient(90deg,#FFD43B,#F76707)"></i></span>
        <span class="val" id="val3">优秀</span>
      </div>
    </div>

    <div class="total-line">综合评级：<b id="totalGrade">S</b>
      <span id="totalWord" style="color:#E8590C;font-weight:900;margin-left:6px;">超级棒！</span>
    </div>
    <div class="total-line" style="font-size:14px;font-weight:400;color:#868E96" id="timeLine"></div>

    <div class="modal-btns">
      <button class="btn btn-blue btn-small" onclick="location.reload()">🔄 再挑战一次</button>
      <button class="btn btn-green btn-small" id="backBtn">📖 重新跟读</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   课文数据（每个 token 用 字|拼音 表示，纯标点单独成 token）
   ========================================================= */
const SENTENCES = [

/* =========================================================
   工具函数
   ========================================================= */
function renderRuby(str) {
  return str.split(/\s+/).filter(Boolean).map(tok => {
    if (tok.indexOf('|') > -1) {
      const parts = tok.split('|');
      return '<ruby>' + parts[0] + '<rt>' + parts[1] + '</rt></ruby>';
    }
    return '<span class="punc">' + tok + '</span>';
  }).join('');
}

function plainText(str) {
  return str.split(/\s+/).filter(Boolean).map(tok => tok.indexOf('|') > -1 ? tok.split('|')[0] : tok).join('');
}

/* =========================================================
   点击音效（Web Audio 合成）
   ========================================================= */
let sfxCtx = null;
function playClickSound() {
  try {
    sfxCtx = sfxCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (sfxCtx.state === 'suspended') sfxCtx.resume();
    const t = sfxCtx.currentTime;
    const o = sfxCtx.createOscillator();
    const g = sfxCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1500, t + 0.08);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.10, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(sfxCtx.destination);
    o.start(t); o.stop(t + 0.2);
  } catch (e) {}
}

/* =========================================================
   语音朗读（TTS）
   ========================================================= */
let zhVoices = [];
function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  zhVoices = speechSynthesis.getVoices().filter(v =>
    /zh|Chinese|中文|普通话|Mandarin/i.test(v.lang + ' ' + v.name)
  );
}
if ('speechSynthesis' in window) {
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
}

let speakToken = 0;
function stopSpeak() {
  speakToken++;
  try { speechSynthesis.cancel(); } catch (e) {}
}

function speak(text, btn, onDone) {
  if (!('speechSynthesis' in window)) {
    if (onDone) setTimeout(onDone, 1400);
    return;
  }
  stopSpeak();
  const myToken = speakToken;

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.72;
  u.pitch = 1.05;
  u.volume = 1;
  if (zhVoices.length) u.voice = zhVoices[0];

  if (btn) btn.classList.add('playing');
  const clear = () => { if (btn) btn.classList.remove('playing'); };

  u.onend = () => {
    clear();
    if (myToken === speakToken && onDone) onDone();
  };
  u.onerror = () => { clear(); };
  setTimeout(clear, 18000);

  speechSynthesis.speak(u);
}

/* ---------- 录音与计时 ---------- */
let mediaStream = null;
let audioCtx = null;
let analyser = null;
let volBuf = null;
let volSamples = [];
let sampleTimer = null;
let tickTimer = null;
let recStartTime = 0;
let isRecording = false;

function fmtTime(ms) {
  const t = Math.floor(ms / 1000);
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}

recordBtn.addEventListener('click', startChallenge);
stopBtn.addEventListener('click', stopChallenge);

async function startChallenge() {
  if (isRecording) return;
  playClickSound();
  stopSpeak();
  isRecording = true;
  volSamples = [];
  recordBtn.disabled = true;
  stopBtn.disabled = false;
  micWarn.classList.remove('show');
  timerEl.classList.add('recording');
  chHint.textContent = '正在录音中……请大声、有感情地朗读全文！';
  chHint.classList.remove('ok');

  recStartTime = performance.now();
  timerEl.textContent = '00:00';
  tickTimer = setInterval(() => {
    timerEl.textContent = fmtTime(performance.now() - recStartTime);
  }, 200);

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);
    volBuf = new Uint8Array(analyser.fftSize);

    sampleTimer = setInterval(() => {
      analyser.getByteTimeDomainData(volBuf);
      let sum = 0;
      for (let i = 0; i < volBuf.length; i++) {
        const x = (volBuf[i] - 128) / 128;
        sum += x * x;
      }
      volSamples.push(Math.sqrt(sum / volBuf.length));
    }, 100);
  } catch (err) {
    console.warn('麦克风不可用：', err);
    micWarn.classList.add('show');
  }
}

function stopChallenge() {
  if (!isRecording) return;
  playClickSound();
  isRecording = false;
  const durationSec = (performance.now() - recStartTime) / 1000;

  clearInterval(tickTimer);
  clearInterval(sampleTimer);
  timerEl.classList.remove('recording');
  stopBtn.disabled = true;
  recordBtn.disabled = true;
  chHint.textContent = '录音完成，正在为你评分……';

  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  if (audioCtx) {
    audioCtx.close().catch(() => {});
    audioCtx = null;
  }
  analyser = null;

  setTimeout(() => showResult(durationSec), 500);
}

/* =========================================================
   评分算法
   ========================================================= */
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function computeScore(durationSec) {
  const TOTAL_CHARS = 268;
  const IDEAL_RATE = 3.2;

  const n = volSamples.length || 1;
  const threshold = 0.015;
  const activeCount = volSamples.filter(v => v > threshold).length;
  const activity = activeCount / n;
  const avgVol = volSamples.reduce((a, b) => a + b, 0) / n;

  const mean = avgVol;
  const variance = volSamples.reduce((a, v) => a + (v - mean) * (v - mean), 0) / n;
  const stability = clamp(100 - Math.sqrt(variance) * 900, 35, 100);

  const rate = TOTAL_CHARS / Math.max(durationSec, 1);
  const rateScore = clamp(100 - Math.abs(rate - IDEAL_RATE) * 16, 35, 100);

  let accuracy = clamp(58 + rateScore * 0.30 + activity * 22 + clamp(avgVol * 260, 0, 14), 50, 99);
  let fluency = clamp(activity * 58 + stability * 0.44, 50, 99);
  const expressiveness = clamp(58 + Math.sqrt(variance) * 1600, 0, 100);
  let rhythm = clamp(rateScore * 0.62 + expressiveness * 0.38, 50, 99);

  if (durationSec < 15) {
    accuracy = clamp(accuracy - 28, 30, 99);
    fluency  = clamp(fluency - 22, 30, 99);
    rhythm   = clamp(rhythm - 18, 30, 99);
  } else if (durationSec < 35) {
    accuracy = clamp(accuracy - 10, 35, 99);
    fluency  = clamp(fluency - 8, 35, 99);
  } else if (durationSec > 240) {
    accuracy = clamp(accuracy - 6, 40, 99);
  }

  accuracy = clamp(accuracy + (Math.random() * 4 - 2), 30, 100);
  fluency  = clamp(fluency  + (Math.random() * 4 - 2), 30, 100);
  rhythm   = clamp(rhythm   + (Math.random() * 4 - 2), 30, 100);

  const total = accuracy * 0.4 + fluency * 0.3 + rhythm * 0.3;

  return {
    accuracy: Math.round(accuracy),
    fluency: Math.round(fluency),
    rhythm: Math.round(rhythm),
    total: Math.round(total),
    durationSec
  };
}

function gradeOf(total) {
  if (total >= 93) return { g: 'S', word: '超级棒！' };
  if (total >= 85) return { g: 'A', word: '非常棒！' };
  if (total >= 76) return { g: 'B', word: '表现不错！' };
  if (total >= 66) return { g: 'C', word: '继续加油！' };
  return { g: 'D', word: '再练一次会更好！' };
}

function qualitative(score) {
  if (score >= 93) return '优秀';
  if (score >= 85) return '良好';
  if (score >= 76) return '不错';
  return '加油';
}

/* =========================================================
   展示结果（不显示具体分数）
   ========================================================= */
const resultModal = document.getElementById('resultModal');

function showResult(durationSec) {
  const r = computeScore(durationSec);
  const gr = gradeOf(r.total);

  document.getElementById('grade').textContent = gr.g;
  document.getElementById('gradeWord').textContent = gr.word;
  document.getElementById('totalGrade').textContent = gr.g;
  document.getElementById('totalWord').textContent = gr.word;

  document.getElementById('val1').textContent = qualitative(r.accuracy);
  document.getElementById('val2').textContent = qualitative(r.fluency);
  document.getElementById('val3').textContent = qualitative(r.rhythm);

  document.getElementById('timeLine').textContent = '朗读用时：' + fmtTime(durationSec * 1000);

  resultModal.classList.add('show');

  setTimeout(() => {
    document.getElementById('bar1').style.width = r.accuracy + '%';
    document.getElementById('bar2').style.width = r.fluency + '%';
    document.getElementById('bar3').style.width = r.rhythm + '%';

}

/* =========================================================
   烟花特效
   ========================================================= */
const fwCanvas = document.getElementById('fireworks');
const fwCtx = fwCanvas.getContext('2d');
let particles = [];
let fwRunning = false;

function resizeFW() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fwCanvas.width = window.innerWidth * dpr;
  fwCanvas.height = window.innerHeight * dpr;
  fwCanvas.style.width = window.innerWidth + 'px';
  fwCanvas.style.height = window.innerHeight + 'px';
  fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function burst(x, y) {
  const hue = Math.random() * 360;
  const count = 55 + Math.floor(Math.random() * 45);
  const power = 2 + Math.random() * 3;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (0.4 + Math.random()) * power;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 0.008 + Math.random() * 0.014,
      hue: hue + Math.random() * 50,
      size: 1.4 + Math.random() * 2.2
    });
  }
}

function fwLoop() {
  if (!fwRunning) return;
  const W = window.innerWidth, H = window.innerHeight;

  fwCtx.globalCompositeOperation = 'source-over';
  fwCtx.fillStyle = 'rgba(8,12,34,0.16)';
  fwCtx.fillRect(0, 0, W, H);

  fwCtx.globalCompositeOperation = 'lighter';
  particles = particles.filter(p => p.life > 0);
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.045;
    p.vx *= 0.988;
    p.vy *= 0.988;
    p.life -= p.decay;

    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, Math.max(p.size * p.life, 0.4), 0, Math.PI * 2);
    fwCtx.fillStyle = 'hsla(' + p.hue + ',100%,' + (55 + p.life * 22) + '%,' + Math.max(p.life, 0) + ')';
    fwCtx.fill();
  }

  requestAnimationFrame(fwLoop);
}

function startFireworks() {
  resizeFW();
  if (fwRunning) return;
  fwRunning = true;
  fwCtx.fillStyle = 'rgba(8,12,34,1)';
  fwCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  fwLoop();

  const W = window.innerWidth, H = window.innerHeight;
  burst(W / 2, H * 0.34);

  setInterval(() => {
    if (!fwRunning) return;
    const x = W * 0.12 + Math.random() * W * 0.76;
    const y = H * 0.08 + Math.random() * H * 0.5;
    burst(x, y);
    if (Math.random() < 0.35) {
      setTimeout(() => burst(W * 0.12 + Math.random() * W * 0.76,
                                H * 0.08 + Math.random() * H * 0.5), 260);
    }
  }, 520);
}

window.addEventListener('resize', () => {
  if (fwRunning) resizeFW();
});

const NOTE = {

  A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99,
  A5: 880.00, B5: 987.77, C6: 1046.50
};

const MELODY = [
  'E5','E5','F5','G5','G5','F5','E5','D5','C5','C5','D5','E5','E5','D5','D5','-',
  'E5','E5','F5','G5','G5','F5','E5','D5','C5','C5','D5','E5','D5','C5','C5','-',
  'D5','D5','E5','C5','D5','E5','F5','E5','C5','D5','E5','F5','G5','E5','D5','C5',
  'E5','E5','F5','G5','G5','F5','E5','D5','C5','C5','D5','E5','D5','C5','C5','-'
];

const BASS = ['C4','C4','G4','G4','A4','A4','G4','G4'];

let bgmCtx = null;
let bgmGain = null;
let bgmPlaying = false;
let bgmStep = 0;
let bgmNextTime = 0;
let bgmTimer = null;
let bgmMuted = false;

function playBGM() {
  if (bgmPlaying) return;
  try {
    bgmCtx = bgmCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (bgmCtx.state === 'suspended') bgmCtx.resume();

    bgmGain = bgmCtx.createGain();
    bgmGain.gain.setValueAtTime(0.0001, bgmCtx.currentTime);
    bgmGain.gain.linearRampToValueAtTime(0.16, bgmCtx.currentTime + 1.5);
    bgmGain.connect(bgmCtx.destination);

    bgmPlaying = true;
    bgmStep = 0;
    bgmNextTime = bgmCtx.currentTime + 0.15;
    bgmTimer = setInterval(scheduleBGM, 40);
  } catch (e) {
    console.warn('BGM 无法播放', e);
  }
}

function scheduleBGM() {
  if (!bgmPlaying || !bgmCtx) return;
  while (bgmNextTime < bgmCtx.currentTime + 0.35) {
    const name = MELODY[bgmStep % MELODY.length];
    if (name !== '-') {
      playTone(NOTE[name], bgmNextTime, 0.24, 'triangle', 1);
      playTone(NOTE[name] * 2, bgmNextTime, 0.16, 'sine', 0.24);
    }
    if (bgmStep % 2 === 0) {
      const bassName = BASS[(bgmStep / 2) % BASS.length];
      playTone(NOTE[bassName], bgmNextTime, 0.4, 'sine', 0.55);
    }
    bgmNextTime += 0.25;
    bgmStep++;
  }
}

function playTone(freq, when, dur, type, vol) {
  const o = bgmCtx.createOscillator();
  const g = bgmCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(0.9 * vol, when + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
  o.connect(g);
  g.connect(bgmGain);
  o.start(when);
  o.stop(when + dur + 0.06);
}

document.getElementById('muteBtn').addEventListener('click', function () {
  bgmMuted = !bgmMuted;
  if (bgmGain && bgmCtx) {
    bgmGain.gain.cancelScheduledValues(bgmCtx.currentTime);
    bgmGain.gain.setValueAtTime(bgmMuted ? 0.0001 : 0.16, bgmCtx.currentTime);
  }
  this.textContent = bgmMuted ? '🔊 开启音乐' : '🔇 关闭音乐';
});

document.getElementById('backBtn').addEventListener('click', () => {
  location.reload();
});

/* =========================================================
   初始化
   ========================================================= */
renderSentence();
</script>
