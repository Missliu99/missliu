<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>朱德的扁担 · 朗读跟读打卡</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Heiti SC", sans-serif;
    background: linear-gradient(180deg, #d9efff 0%, #fff6e2 55%, #ffe9d0 100%);
    min-height: 100vh;
    color: #2f3542;
    padding: 14px 14px 40px;
    overflow-x: hidden;
  }

  /* ---------- 顶部标题 ---------- */
  .title-bar {
    text-align: center;
    margin: 4px 0 16px;
  }
  .title-bar h1 {
    font-size: 24px;
    margin: 0 0 6px;
    color: #e8590c;
    letter-spacing: 2px;
    text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(232,89,12,.18);
  }
  .title-bar .sub {
    font-size: 13px;
    color: #868e96;
    letter-spacing: 1px;
  }

  /* ---------- 通用卡片 ---------- */
  .card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 22px rgba(80,120,180,.14), inset 0 0 0 3px #fff;
    padding: 18px 16px;
    margin: 0 auto 16px;
    max-width: 760px;
    position: relative;
  }

  /* ---------- 关卡头 ---------- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .badge {
    background: linear-gradient(135deg, #ffa94d, #ff6b35);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(255,107,53,.32);
  }
  .badge.blue {
    background: linear-gradient(135deg, #74c0fc, #1c7ed6);
    box-shadow: 0 4px 10px rgba(28,126,214,.32);
  }
  .counter {
    font-size: 15px;
    color: #495057;
    font-weight: 700;
  }
  .counter b { color: #e8590c; font-size: 20px; }
  .timer {
    font-family: "Courier New", monospace;
    font-size: 22px;
    font-weight: 700;
    color: #e03131;
    background: #fff0f0;
    padding: 3px 14px;
    border-radius: 12px;
    letter-spacing: 1px;
  }
  .timer.recording {
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 100% { background: #fff0f0; }
    50% { background: #ffc9c9; }
  }

  /* ---------- 进度条 ---------- */
  .progress-track {
    height: 12px;
    background: #e9ecef;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #69db7c, #38d9a9, #4dabf7);
    border-radius: 999px;
    transition: width .45s cubic-bezier(.4,1.4,.5,1);
  }

  /* ---------- 句子区 ---------- */
  .sentence {
    font-size: 30px;
    line-height: 2.15;
    text-align: center;
    margin: 10px 0 6px;
    color: #212529;
    font-weight: 600;
    word-break: break-word;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2px;
  }
  ruby { ruby-align: center; }
  rt {
    font-size: 0.44em;
    color: #f76707;
    font-weight: 700;
    letter-spacing: .02em;
    font-family: "Arial", sans-serif;
  }
  .punc { color: #495057; font-weight: 600; }

  /* ---------- 按钮 ---------- */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .btn {
    border: none;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    padding: 13px 30px;
    cursor: pointer;
    font-family: inherit;
    color: #fff;
    transition: transform .12s, box-shadow .18s, opacity .18s;
    letter-spacing: 1px;
    box-shadow: 0 6px 0 rgba(0,0,0,.14);
  }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
  .btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
  .btn-blue { background: linear-gradient(135deg, #4dabf7, #1c7ed6); }
  .btn-green { background: linear-gradient(135deg, #69db7c, #2f9e44); }
  .btn-red { background: linear-gradient(135deg, #ff8787, #e03131); }
  .btn-orange { background: linear-gradient(135deg, #ffc078, #f76707); }
  .btn-small { font-size: 15px; padding: 9px 20px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }

  .btn.playing { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .hint {
    text-align: center;
    font-size: 14px;
    color: #868e96;
    margin-top: 14px;
    min-height: 20px;
    transition: color .3s;
  }
  .hint.ok { color: #2f9e44; font-weight: 700; }

  /* ---------- 全文区 ---------- */
  .fulltext {
    max-height: 46vh;
    overflow-y: auto;
    padding: 6px 4px;
    border-radius: 16px;
    background: #fdfdff;
    border: 2px dashed #d0ebff;
  }
  .full-line {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 8px;
    border-radius: 12px;
    transition: background .3s;
  }
  .full-line:hover { background: #f1f9ff; }
  .full-line.highlight { background: #fff3bf; }
  .full-line .fs-text {
    flex: 1;
    font-size: 20px;
    line-height: 2.2;
    color: #343a40;
    font-weight: 600;
  }
  .mini-play {
    flex: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #a5d8ff, #4dabf7);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(77,171,247,.4);
    transition: transform .12s;
    margin-top: 2px;
  }
  .mini-play:active { transform: scale(.9); }

  /* ---------- 弹窗 ---------- */
  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 18px;
  }
  .modal.show { display: flex; }
  #fireworks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(8, 12, 34, .86);
  }
  .result-card {
    position: relative;
    z-index: 2;
    background: linear-gradient(180deg, #ffffff, #fff9ef);
    border-radius: 28px;
    padding: 26px 22px 22px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 4px rgba(255,212,59,.6);
    animation: pop .55s cubic-bezier(.2,1.6,.5,1);
  }
  @keyframes pop {
    0% { transform: scale(.5) rotate(-6deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .grade {
    font-size: 78px;
    font-weight: 900;
    line-height: 1;
    font-family: "Arial Black", Arial, sans-serif;
    background: linear-gradient(135deg, #ffd43b, #ff922b, #f03e3e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 6px 18px rgba(255,146,43,.35);
    animation: gradePop .8s ease;
  }
  @keyframes gradePop {
    0% { transform: scale(0) rotate(-30deg); }
    70% { transform: scale(1.25) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .grade-word {
    font-size: 15px;
    color: #868e96;
    letter-spacing: 4px;
    margin-top: 2px;
  }
  .praise {
    font-size: 26px;
    font-weight: 900;
    color: #e8590c;
    margin: 14px 0 4px;
    letter-spacing: 2px;
    animation: wave 1.6s infinite;
  }
  .praise2 {
    font-size: 19px;
    font-weight: 800;
    color: #1c7ed6;
    letter-spacing: 1px;
  }
  @keyframes wave {
    0%,100% { transform: rotate(-2deg) scale(1); }
    50% { transform: rotate(2deg) scale(1.05); }
  }
  .scores {
    margin: 18px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #495057;
  }
  .score-row .lbl { width: 84px; text-align: right; flex: none; font-weight: 700; }
  .score-bar {
    flex: 1;
    height: 14px;
    background: #e9ecef;
    border-radius: 999px;
    overflow: hidden;
  }
  .score-bar > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    transition: width 1s cubic-bezier(.3,1.3,.5,1);
  }
  .score-row .val { width: 56px; flex: none; font-weight: 800; color: #e8590c; font-size: 14px; }
  .total-line {
    margin-top: 14px;
    font-size: 16px;
    color: #495057;
    font-weight: 700;
  }
  .total-line b { color: #e03131; font-size: 24px; }

  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .mute-btn {
    position: absolute;
    right: 12px; top: 12px;
    z-index: 3;
    border: none;
    background: rgba(255,255,255,.92);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    color: #495057;
    font-weight: 700;
  }

  /* ---------- 屏幕切换 ---------- */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn .45s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .mic-warn {
    text-align: center;
    font-size: 13px;
    color: #e03131;
    background: #fff5f5;
    border-radius: 12px;
    padding: 8px 12px;
    margin-top: 10px;
    display: none;
  }
  .mic-warn.show { display: block; }

  @media (max-width: 480px) {
    .sentence { font-size: 23px; line-height: 2.2; }
    .full-line .fs-text { font-size: 17px; }
    .btn { font-size: 16px; padding: 12px 22px; }
    .title-bar h1 { font-size: 20px; }
    .grade { font-size: 64px; }
  }
</style>
</head>
<body>

<div class="title-bar">
  <h1>🍊 朱德的扁担 · 朗读打卡 🍊</h1>
  <div class="sub">二年级语文 · 跟读练习</div>
</div>

<!-- ================= 第一关：逐句跟读 ================= -->
<section id="practice" class="screen active">
  <div class="card">
    <div class="bar">
      <span class="badge">第一关 · 逐句跟读</span>
      <span class="counter">第 <b id="curIdx">1</b> / 12 句</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>

    <p class="sentence" id="sentenceText"></p>

    <div class="controls">
      <button id="demoBtn" class="btn btn-blue">🔊 示范跟读</button>
      <button id="nextBtn" class="btn btn-green" disabled>下一句 ➜</button>
    </div>
    <p class="hint" id="hint">先点击「示范跟读」听一听，再自己大声读一遍哦～</p>
  </div>
</section>

<!-- ================= 第二关：全文挑战 ================= -->
<section id="challenge" class="screen">
  <div class="card">
    <div class="bar">
      <span class="badge blue">第二关 · 全文朗读挑战</span>
      <span class="timer" id="timer">00:00</span>
    </div>
    <div class="fulltext" id="fullText"></div>

    <div class="controls">
      <button id="recordBtn" class="btn btn-red">🎤 我来挑战</button>
      <button id="stopBtn" class="btn btn-orange" disabled>⏹ 停止录音</button>
    </div>
    <p class="hint" id="chHint">准备好了吗？点击「我来挑战」，从第一句开始大声朗读吧！</p>
    <div class="mic-warn" id="micWarn">⚠️ 没有检测到麦克风，将根据朗读时长为你评分～</div>
  </div>
</section>

<!-- ================= 结果弹窗 ================= -->
<div class="modal" id="resultModal">
  <canvas id="fireworks"></canvas>
  <button class="mute-btn" id="muteBtn">🔇 关闭音乐</button>
  <div class="result-card">
    <div class="grade" id="grade">S</div>
    <div class="grade-word" id="gradeWord">超级棒</div>
    <div class="praise">你真棒！🎉</div>
    <div class="praise2">你是朗读小达人 ⭐</div>

    <div class="scores">
      <div class="score-row">
        <span class="lbl">发音正确率</span>
        <span class="score-bar"><i id="bar1" style="background:linear-gradient(90deg,#69db7c,#2f9e44)"></i></span>
        <span class="val" id="val1">优秀</span>
      </div>
      <div class="score-row">
        <span class="lbl">朗读流畅度</span>
        <span class="score-bar"><i id="bar2" style="background:linear-gradient(90deg,#74c0fc,#1c7ed6)"></i></span>
        <span class="val" id="val2">优秀</span>
      </div>
      <div class="score-row">
        <span class="lbl">节奏情感</span>
        <span class="score-bar"><i id="bar3" style="background:linear-gradient(90deg,#ffd43b,#f76707)"></i></span>
        <span class="val" id="val3">优秀</span>
      </div>
    </div>

    <div class="total-line">综合评级：<b id="totalGrade">S</b>
      <span id="totalWord" style="color:#e8590c;font-weight:800;margin-left:6px;">超级棒！</span>
    </div>
    <div class="total-line" style="font-size:14px;font-weight:400;color:#868e96" id="timeLine"></div>

    <div class="modal-btns">
      <button class="btn btn-blue btn-small" onclick="location.reload()">🔄 再挑战一次</button>
      <button class="btn btn-green btn-small" id="backBtn">📖 重新跟读</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   课文数据（每个 token 用 字|拼音 表示，纯标点单独成 token）
   ========================================================= */
const SENTENCES = [
  "1928 年|nián ， 朱|zhū 德|dé 同|tóng 志|zhì 带|dài 领|lǐng 队|duì 伍|wǔ 到|dào 井|jǐng 冈|gāng 山|shān ， 跟|gēn 毛|máo 泽|zé 东|dōng 同|tóng 志|zhì 会|huì 师|shī 了|le 。",

  "红|hóng 军|jūn 在|zài 山|shān 上|shàng ， 山|shān 下|xià 不|bù 远|yuǎn 处|chù 就|jiù 是|shì 敌|dí 人|rén 。",

  "红|hóng 军|jūn 要|yào 巩|gǒng 固|gù 井|jǐng 冈|gāng 山|shān 根|gēn 据|jù 地|dì ， 粉|fěn 碎|suì 敌|dí 人|rén 的|de 围|wéi 攻|gōng ， 需|xū 要|yào 储|chǔ 备|bèi 足|zú 够|gòu 的|de 粮|liáng 食|shí 。",

  "井|jǐng 冈|gāng 山|shān 上|shàng 生|shēng 产|chǎn 粮|liáng 食|shí 不|bù 多|duō ， 常|cháng 常|cháng 要|yào 抽|chōu 出|chū 一|yī 些|xiē 人|rén 到|dào 茅|máo 坪|píng 去|qù 挑|tiāo 粮|liáng 。",

  "从|cóng 井|jǐng 冈|gāng 山|shān 到|dào 茅|máo 坪|píng ， 来|lái 回|huí 有|yǒu 五|wǔ 六|liù 十|shí 里|lǐ ， 山|shān 高|gāo 路|lù 陡|dǒu ， 非|fēi 常|cháng 难|nán 走|zǒu 。",

  "可|kě 是|shì 每|měi 次|cì 挑|tiāo 粮|liáng ， 大|dà 家|jiā 都|dōu 争|zhēng 着|zhe 去|qù 。",

  "朱|zhū 德|dé 同|tóng 志|zhì 也|yě 跟|gēn 战|zhàn 士|shì 们|men 一|yí 块|kuài 儿|er 去|qù 挑|tiāo 粮|liáng 。",

  "他|tā 穿|chuān 着|zhe 草|cǎo 鞋|xié ， 戴|dài 着|zhe 斗|dǒu 笠|lì ， 挑|tiāo 起|qǐ 粮|liáng 食|shí ， 跟|gēn 大|dà 家|jiā 一|yí 块|kuài 儿|er 爬|pá 山|shān 。",

  "白|bái 天|tiān 挑|tiāo 粮|liáng 爬|pá 山|shān ， 晚|wǎn 上|shang 还|hái 常|cháng 常|cháng 整|zhěng 夜|yè 整|zhěng 夜|yè 地|de 研|yán 究|jiū 怎|zěn 样|yàng 跟|gēn 敌|dí 人|rén 打|dǎ 仗|zhàng 。",

  "大|dà 家|jiā 看|kàn 了|le 心|xīn 疼|téng ， 就|jiù 把|bǎ 他|tā 那|nà 根|gēn 扁|biǎn 担|dan 藏|cáng 了|le 起|qǐ 来|lái 。",

  "不|bú 料|liào ， 朱|zhū 德|dé 同|tóng 志|zhì 又|yòu 找|zhǎo 来|lái 一|yì 根|gēn 扁|biǎn 担|dan ， 写|xiě 上|shang “ 朱|zhū 德|dé 的|de 扁|biǎn 担|dan ” 五|wǔ 个|gè 字|zì 。",

  "大|dà 家|jiā 见|jiàn 了|le ， 越|yuè 发|fā 敬|jìng 爱|ài 朱|zhū 德|dé 同|tóng 志|zhì ， 不|bù 好|hǎo 意|yì 思|si 再|zài 藏|cáng 他|tā 的|de 扁|biǎn 担|dan 了|le 。"
];

/* =========================================================
   工具函数
   ========================================================= */
function renderRuby(str) {
  return str.split(/\s+/).filter(Boolean).map(tok => {
    if (tok.indexOf('|') > -1) {
      const parts = tok.split('|');
      return '<ruby>' + parts[0] + '<rt>' + parts[1] + '</rt></ruby>';
    }
    return '<span class="punc">' + tok + '</span>';
  }).join('');
}

function plainText(str) {
  return str.split(/\s+/).filter(Boolean).map(tok => tok.indexOf('|') > -1 ? tok.split('|')[0] : tok).join('');
}

/* =========================================================
   语音朗读（TTS）
   ========================================================= */
let zhVoices = [];
function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  zhVoices = speechSynthesis.getVoices().filter(v =>
    /zh|Chinese|中文|普通话|Mandarin/i.test(v.lang + ' ' + v.name)
  );
}
if ('speechSynthesis' in window) {
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
}

function speak(text, btn) {
  if (!('speechSynthesis' in window)) {
    alert('抱歉，当前浏览器不支持语音朗读功能，请使用 Chrome 或 Edge 浏览器～');
    return;
  }
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.72;      // 慢一点，方便小朋友跟读
  u.pitch = 1.05;
  u.volume = 1;
  if (zhVoices.length) u.voice = zhVoices[0];

  if (btn) {
    btn.classList.add('playing');
    const clear = () => btn.classList.remove('playing');
    u.onend = clear;
    u.onerror = clear;
    setTimeout(clear, 15000); // 兜底
  }
  speechSynthesis.speak(u);
}

/* =========================================================
   第一关：逐句跟读
   ========================================================= */
const practiceScreen = document.getElementById('practice');
const challengeScreen = document.getElementById('challenge');
const sentenceText = document.getElementById('sentenceText');
const curIdxEl = document.getElementById('curIdx');
const progFill = document.getElementById('progFill');
const demoBtn = document.getElementById('demoBtn');
const nextBtn = document.getElementById('nextBtn');
const hintEl = document.getElementById('hint');

let cur = 0;
const demoDone = new Set();

function renderSentence() {
  sentenceText.innerHTML = renderRuby(SENTENCES[cur]);
  curIdxEl.textContent = cur + 1;
  progFill.style.width = ((cur) / SENTENCES.length * 100) + '%';

  const done = demoDone.has(cur);
  nextBtn.disabled = !done;
  nextBtn.textContent = (cur === SENTENCES.length - 1) ? '进入全文挑战 🚀' : '下一句 ➜';

  if (done) {
    hintEl.textContent = '读得真棒！点「下一句」继续吧～';

    hintEl.classList.remove('ok');
  }
}

const timerEl = document.getElementById('timer');
const recordBtn = document.getElementById('recordBtn');
const stopBtn = document.getElementById('stopBtn');
const chHint = document.getElementById('chHint');

/* ---------- 录音与计时 ---------- */
let mediaStream = null;
let audioCtx = null;
let analyser = null;
let volBuf = null;
let volSamples = [];
let sampleTimer = null;
let tickTimer = null;
let recStartTime = 0;
let isRecording = false;

function fmtTime(ms) {
  const t = Math.floor(ms / 1000);
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}

recordBtn.addEventListener('click', startChallenge);
stopBtn.addEventListener('click', stopChallenge);

async function startChallenge() {
  if (isRecording) return;
  isRecording = true;
  volSamples = [];
  recordBtn.disabled = true;
  stopBtn.disabled = false;
  micWarn.classList.remove('show');
  timerEl.classList.add('recording');
  chHint.textContent = '正在录音中……请大声、有感情地朗读全文！';
  chHint.classList.remove('ok');

  recStartTime = performance.now();
  timerEl.textContent = '00:00';
  tickTimer = setInterval(() => {
    timerEl.textContent = fmtTime(performance.now() - recStartTime);
  }, 200);

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);
    volBuf = new Uint8Array(analyser.fftSize);

    sampleTimer = setInterval(() => {
      analyser.getByteTimeDomainData(volBuf);
      let sum = 0;
      for (let i = 0; i < volBuf.length; i++) {
        const x = (volBuf[i] - 128) / 128;
        sum += x * x;
      }
      volSamples.push(Math.sqrt(sum / volBuf.length));
    }, 100);
  } catch (err) {
    console.warn('麦克风不可用：', err);
    micWarn.classList.add('show');
  }
}

function stopChallenge() {
  if (!isRecording) return;
  isRecording = false;
  const durationSec = (performance.now() - recStartTime) / 1000;

  clearInterval(tickTimer);
  clearInterval(sampleTimer);
  timerEl.classList.remove('recording');
  stopBtn.disabled = true;
  recordBtn.disabled = true;
  chHint.textContent = '录音完成，正在为你评分……';

  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  if (audioCtx) {
    audioCtx.close().catch(() => {});
    audioCtx = null;
  }
  analyser = null;

  setTimeout(() => showResult(durationSec), 500);
}

/* =========================================================
   评分算法
   ========================================================= */
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function computeScore(durationSec) {
  const TOTAL_CHARS = 268;       // 全文大约字数
  const IDEAL_RATE = 3.2;        // 理想语速：字/秒

  const n = volSamples.length || 1;
  const threshold = 0.015;
  const activeCount = volSamples.filter(v => v > threshold).length;
  const activity = activeCount / n;                       // 有效发声占比
  const avgVol = volSamples.reduce((a, b) => a + b, 0) / n;

  const mean = avgVol;
  const variance = volSamples.reduce((a, v) => a + (v - mean) * (v - mean), 0) / n;
  const stability = clamp(100 - Math.sqrt(variance) * 900, 35, 100);

  const rate = TOTAL_CHARS / Math.max(durationSec, 1);
  const rateScore = clamp(100 - Math.abs(rate - IDEAL_RATE) * 16, 35, 100);

  // 1. 发音正确率（语速合理度 + 发声饱满度）
  let accuracy = clamp(
    58 + rateScore * 0.30 + activity * 22 + clamp(avgVol * 260, 0, 14),
    50, 99
  );

  // 2. 朗读流畅度（发声连贯 + 音量稳定）
  let fluency = clamp(activity * 58 + stability * 0.44, 50, 99);

  // 3. 节奏情感（语速 + 音量起伏）
  const expressiveness = clamp(58 + Math.sqrt(variance) * 1600, 0, 100);
  let rhythm = clamp(rateScore * 0.62 + expressiveness * 0.38, 50, 99);

  // 时长太短 / 太长 的修正
  if (durationSec < 15) {
    accuracy = clamp(accuracy - 28, 30, 99);
    fluency  = clamp(fluency - 22, 30, 99);
    rhythm   = clamp(rhythm - 18, 30, 99);
  } else if (durationSec < 35) {
    accuracy = clamp(accuracy - 10, 35, 99);
    fluency  = clamp(fluency - 8, 35, 99);
  } else if (durationSec > 240) {
    accuracy = clamp(accuracy - 6, 40, 99);
  }

  // 一点点自然波动，让每次朗读都有新鲜感
  accuracy = clamp(accuracy + (Math.random() * 4 - 2), 30, 100);
  fluency  = clamp(fluency  + (Math.random() * 4 - 2), 30, 100);
  rhythm   = clamp(rhythm   + (Math.random() * 4 - 2), 30, 100);

  const total = accuracy * 0.4 + fluency * 0.3 + rhythm * 0.3;

  return {
    accuracy: Math.round(accuracy),
    fluency: Math.round(fluency),
    rhythm: Math.round(rhythm),
    total: Math.round(total),
    durationSec
  };
}

function gradeOf(total) {
  if (total >= 93) return { g: 'S', word: '超级棒！' };
  if (total >= 85) return { g: 'A', word: '非常棒！' };
  if (total >= 76) return { g: 'B', word: '表现不错！' };
  if (total >= 66) return { g: 'C', word: '继续加油！' };
  return { g: 'D', word: '再练一次会更好！' };
}

/* 把分数换算成定性评价（不再显示数字） */
function qualitative(score) {
  if (score >= 93) return '优秀';
  if (score >= 85) return '良好';
  if (score >= 76) return '不错';
  return '加油';
}

/* =========================================================
   展示结果（不显示具体分数）
   ========================================================= */
const resultModal = document.getElementById('resultModal');

function showResult(durationSec) {
  const r = computeScore(durationSec);
  const gr = gradeOf(r.total);

  document.getElementById('grade').textContent = gr.g;
  document.getElementById('gradeWord').textContent = gr.word;

  // 只给等级，不给具体分数
  document.getElementById('totalGrade').textContent = gr.g;
  document.getElementById('totalWord').textContent = gr.word;

  // 三个维度只显示文字评价
  document.getElementById('val1').textContent = qualitative(r.accuracy);
  document.getElementById('val2').textContent = qualitative(r.fluency);
  document.getElementById('val3').textContent = qualitative(r.rhythm);

  // 朗读用时仍保留（属于时长，不是分数）
  document.getElementById('timeLine').textContent = '朗读用时：' + fmtTime(durationSec * 1000);

  resultModal.classList.add('show');

  // 条形图只显示“相对高低”，不标数字
  setTimeout(() => {
    document.getElementById('bar1').style.width = r.accuracy + '%';
    document.getElementById('bar2').style.width = r.fluency + '%';
    document.getElementById('bar3').style.width = r.rhythm + '%';
  }, 220);

  startFireworks();
  playBGM();
}

/* =========================================================
   烟花特效
   ========================================================= */
const fwCanvas = document.getElementById('fireworks');
const fwCtx = fwCanvas.getContext('2d');
let particles = [];
let fwRunning = false;
let fwTimer = null;

function resizeFW() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fwCanvas.width = window.innerWidth * dpr;
  fwCanvas.height = window.innerHeight * dpr;
  fwCanvas.style.width = window.innerWidth + 'px';
  fwCanvas.style.height = window.innerHeight + 'px';
  fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function burst(x, y) {
  const hue = Math.random() * 360;
  const count = 55 + Math.floor(Math.random() * 45);
  const power = 2 + Math.random() * 3;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (0.4 + Math.random()) * power;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 0.008 + Math.random() * 0.014,
      hue: hue + Math.random() * 50,
      size: 1.4 + Math.random() * 2.2
    });
  }
}

function fwLoop() {
  if (!fwRunning) return;
  const W = window.innerWidth, H = window.innerHeight;

  fwCtx.globalCompositeOperation = 'source-over';
  fwCtx.fillStyle = 'rgba(8,12,34,0.16)';
  fwCtx.fillRect(0, 0, W, H);

  fwCtx.globalCompositeOperation = 'lighter';
  particles = particles.filter(p => p.life > 0);
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.045;
    p.vx *= 0.988;
    p.vy *= 0.988;
    p.life -= p.decay;

    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, Math.max(p.size * p.life, 0.4), 0, Math.PI * 2);
    fwCtx.fillStyle = 'hsla(' + p.hue + ',100%,' + (55 + p.life * 22) + '%,' + Math.max(p.life, 0) + ')';
    fwCtx.fill();
  }

  requestAnimationFrame(fwLoop);
}

function startFireworks() {
  resizeFW();
  if (fwRunning) return;
  fwRunning = true;
  fwCtx.fillStyle = 'rgba(8,12,34,1)';
  fwCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  fwLoop();

  const W = window.innerWidth, H = window.innerHeight;
  burst(W / 2, H * 0.34);

  fwTimer = setInterval(() => {
    const x = W * 0.12 + Math.random() * W * 0.76;
    const y = H * 0.08 + Math.random() * H * 0.5;
    burst(x, y);
    if (Math.random() < 0.35) {
      setTimeout(() => burst(W * 0.12 + Math.random() * W * 0.76,
                                H * 0.08 + Math.random() * H * 0.5), 260);
    }
  }, 520);
}

window.addEventListener('resize', () => {
  if (fwRunning) resizeFW();
});

/* =========================================================
   BGM（Web Audio 合成欢快旋律）
   ========================================================= */
const NOTE = {
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
  A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99,
  A5: 880.00, B5: 987.77, C6: 1046.50
};

const MELODY = [
  'E5','E5','F5','G5','G5','F5','E5','D5','C5','C5','D5','E5','E5','D5','D5','-',
  'E5','E5','F5','G5','G5','F5','E5','D5','C5','C5','D5','E5','D5','C5','C5','-',
  'D5','D5','E5','C5','D5','E5','F5','E5','C5','D5','E5','F5','G5','E5','D5','C5',
  'E5','E5','F5','G5','G5','F5','E5','D5','C5','C5','D5','E5','D5','C5','C5','-'
];

const BASS = ['C4','C4','G4','G4','A4','A4','G4','G4'];

let bgmCtx = null;
let bgmGain = null;
let bgmPlaying = false;
let bgmStep = 0;
let bgmNextTime = 0;
let bgmTimer = null;
let bgmMuted = false;

function playBGM() {
  if (bgmPlaying) return;
  try {
    bgmCtx = bgmCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (bgmCtx.state === 'suspended') bgmCtx.resume();

    bgmGain = bgmCtx.createGain();
    bgmGain.gain.setValueAtTime(0.0001, bgmCtx.currentTime);
    bgmGain.gain.linearRampToValueAtTime(0.16, bgmCtx.currentTime + 1.5);
    bgmGain.connect(bgmCtx.destination);

    bgmPlaying = true;
    bgmStep = 0;
    bgmNextTime = bgmCtx.currentTime + 0.15;
    bgmTimer = setInterval(scheduleBGM, 40);
  } catch (e) {
    console.warn('BGM 无法播放', e);
  }
}

function scheduleBGM() {
  if (!bgmPlaying || !bgmCtx) return;
  while (bgmNextTime < bgmCtx.currentTime + 0.35) {
    const name = MELODY[bgmStep % MELODY.length];
    if (name !== '-') {
      playTone(NOTE[name], bgmNextTime, 0.24, 'triangle', 1);
      playTone(NOTE[name] * 2, bgmNextTime, 0.16, 'sine', 0.24);
    }
    // 每两个八分音符加一个低音
    if (bgmStep % 2 === 0) {
      const bassName = BASS[(bgmStep / 2) % BASS.length];
      playTone(NOTE[bassName], bgmNextTime, 0.4, 'sine', 0.55);
    }
    bgmNextTime += 0.25;
    bgmStep++;
  }
}

function playTone(freq, when, dur, type, vol) {
  const o = bgmCtx.createOscillator();
  const g = bgmCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(0.9 * vol, when + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
  o.connect(g);
  g.connect(bgmGain);
  o.start(when);
  o.stop(when + dur + 0.06);
}

document.getElementById('muteBtn').addEventListener('click', function () {
  bgmMuted = !bgmMuted;
  if (bgmGain) {
    bgmGain.gain.cancelScheduledValues(bgmCtx.currentTime);
    bgmGain.gain.setValueAtTime(bgmMuted ? 0.0001 : 0.16, bgmCtx.currentTime);
  }
  this.textContent = bgmMuted ? '🔊 开启音乐' : '🔇 关闭音乐';
});

document.getElementById('backBtn').addEventListener('click', () => {
  location.reload();
});
