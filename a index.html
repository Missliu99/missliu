<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 优化：针对手机端和微信禁用手势缩放，适配刘海屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>识字闯关小能手（第五单元）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* 优先使用手机系统自带字体，防止字体加载卡顿或回退难看 */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            /* 禁用手势选中，防止误触影响体验 */
            -webkit-user-select: none;
            user-select: none;
            /* 去除移动端点击时的蓝色或灰色高亮背景 */
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #e6f2ff;
            overflow: hidden; /* 防止出现页面滚动 */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 优化：使用 100% 高度代替 vh，解决微信浏览器地址栏伸缩导致的卡顿/跳动 */
        .game-container {
            background: #fff;
            width: 100%;
            height: 100%;
            max-width: 600px; /* 在平板上也能居中显示 */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            /* 安全区适配，防止被手机底部黑条遮挡 */
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        @media (min-width: 601px) {
            .game-container {
                height: 90%;
                border-radius: 30px;
                border: 5px solid #a2d2ff;
                box-shadow: 0 10px 30px rgba(162, 210, 255, 0.4);
            }
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .screen.active {
            display: flex;
        }

        /* 优化动画：将原本持续移动的动画改为轻微呼吸效果，减少手机GPU重绘压力 */
        .cat-img {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .btn {
            background-color: #ff9a9e;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #e06b6f;
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 30px;
            font-weight: bold;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #e06b6f;
        }

        /* 游戏主界面 */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            color: #5c9ce6;
            font-weight: bold;
            padding: 0 10px;
            margin-bottom: 10px;
        }

        .question-area {
            text-align: center;
            background: #f0f8ff;
            padding: 15px 20px;
            border-radius: 20px;
            border: 3px dashed #a2d2ff;
            width: 100%;
            margin-bottom: 20px;
        }

        .word-display {
            font-size: 55px;
            color: #333;
            font-weight: bold;
            font-family: 'KaiTi', 'STKaiti', serif;
        }

        .phrase-display {
            font-size: 18px;
            color: #666;
            margin-top: 5px;
        }

        /* 选择区域 */
        .selection-group {
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            padding: 0 5px;
        }

        .group-label {
            font-size: 18px;
            font-weight: bold;
            color: #5c9ce6;
            width: 50px;
            flex-shrink: 0;
        }

        .options {
            display: flex;
            gap: 8px;
            flex-grow: 1;
            flex-wrap: nowrap; /* 强制不换行 */
        }

        /* 优化：选项按钮使用 flex 均分宽度，确保在小屏幕也能一行放下 */
        .option-btn {
            flex: 1;
            background-color: #fff;
            border: 2px solid #a2d2ff;
            color: #333;
            padding: 10px 0;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.1s, color 0.1s;
            font-family: 'Arial', sans-serif;
            text-align: center;
            min-width: 0;
        }

        .option-btn.selected {
            background-color: #a2d2ff;
            color: #fff;
            border-color: #5c9ce6;
        }

        /* 提交按钮 */
        .submit-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 0;
            width: 80%;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #388E3C;
            margin-top: 15px;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #388E3C;
        }
        
        .submit-btn:disabled {
            background-color: #ccc;
            box-shadow: 0 4px 0 #999;
            cursor: not-allowed;
            transform: none;
        }

        /* 反馈信息 */
        .feedback {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: center;
            min-height: 30px;
        }
        .feedback.show { opacity: 1; }
        .feedback.correct { color: #2ed573; }
        .feedback.wrong { color: #ff4757; }

        /* 结束页面评分 */
        .score-display {
            font-size: 90px;
            color: #ff6b81;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 开始页面 -->
        <div id="start-screen" class="screen active">
            <div class="cat-img">🐱</div>
            <h1 style="color: #ff6b81; font-size: 32px; margin-bottom: 15px; text-align: center;">识字闯关小能手<br><span style="font-size: 22px;">（第五单元）</span></h1>
            <p style="color: #666; font-size: 16px; text-align: center; line-height: 1.6;">
                选出正确的<b>声母</b>、<b>韵母</b>和<b>声调</b>吧！<br>
                <span style="font-size: 14px;">(共27道题，注意平翘舌和前后鼻音哦！)</span>
            </p>
            <button class="btn" onclick="startGame()">开始闯关</button>
        </div>

        <!-- 游戏页面 -->
        <div id="game-screen" class="screen">
            <div class="header">
                <span id="progress-display">1 / 27</span>
                <span>得分: <span id="score-display">0</span></span>
            </div>
            
            <div class="question-area">
                <div id="word-display" class="word-display">观</div>
                <div id="phrase-display" class="phrase-display">组词：观看</div>
            </div>
            
            <div class="selection-group">
                <div class="group-label">声母</div>
                <div id="shengmu-options" class="options"></div>
            </div>
            <div class="selection-group">
                <div class="group-label">韵母</div>
                <div id="yunmu-options" class="options"></div>
            </div>
            <div class="selection-group">
                <div class="group-label">声调</div>
                <div id="tone-options" class="options"></div>
            </div>

            <button id="submit-btn" class="submit-btn" onclick="checkAnswer()" disabled>提交答案</button>
            <div id="feedback" class="feedback"></div>
        </div>

        <!-- 结束页面 -->
        <div id="end-screen" class="screen">
            <div class="cat-img">😻</div>
            <h1 style="color: #ff6b81; font-size: 36px;">你真棒！</h1>
            <div id="final-score" class="score-display">S</div>
            <p id="final-text" style="color: #666; font-size: 18px;">正确率：100%</p>
            <p id="praise-text" style="color: #ff9a9e; font-size: 20px; margin-top: 10px; font-weight: bold; text-align: center;">拼音小达人！</p>
            <button class="btn" onclick="location.reload()">再玩一次</button>
        </div>
    </div>

    <script>
        // 依据第五单元图片内容整理的题库，包含27个字
        const wordList = [
            { char: '观', word: '观看', sm: 'g', ym: 'uan', tone: '1', smOpt: ['g', 'k', 'h'], ymOpt: ['uan', 'uang', 'an'], toneOpt: ['1', '2', '3', '4'] },
            { char: '呀', word: '哎呀', sm: 'y', ym: 'a', tone: '1', smOpt: ['y', 'w', 'r'], ymOpt: ['a', 'ia', 'ua'], toneOpt: ['1', '2', '3', '4'] },
            { char: '答', word: '回答', sm: 'd', ym: 'a', tone: '2', smOpt: ['d', 't', 'b'], ymOpt: ['a', 'ia', 'ua'], toneOpt: ['1', '2', '3', '4'] },
            { char: '话', word: '说话', sm: 'h', ym: 'ua', tone: '4', smOpt: ['h', 'f', 'g'], ymOpt: ['ua', 'a', 'uo'], toneOpt: ['1', '2', '3', '4'] },
            { char: '抬', word: '抬头', sm: 't', ym: 'ai', tone: '2', smOpt: ['t', 'd', 'n'], ymOpt: ['ai', 'an', 'ao'], toneOpt: ['1', '2', '3', '4'] },
            { char: '能', word: '能力', sm: 'n', ym: 'eng', tone: '2', smOpt: ['n', 'l', 'r'], ymOpt: ['eng', 'en', 'ong'], toneOpt: ['1', '2', '3', '4'] },
            { char: '信', word: '信心', sm: 'x', ym: 'in', tone: '4', smOpt: ['x', 's', 'sh'], ymOpt: ['in', 'ing', 'ian'], toneOpt: ['1', '2', '3', '4'] },
            { char: '阵', word: '一阵', sm: 'zh', ym: 'en', tone: '4', smOpt: ['zh', 'z', 'ch'], ymOpt: ['en', 'eng', 'an'], toneOpt: ['1', '2', '3', '4'] },
            { char: '做', word: '做事', sm: 'z', ym: 'uo', tone: '4', smOpt: ['z', 'zh', 'c'], ymOpt: ['uo', 'ou', 'ao'], toneOpt: ['1', '2', '3', '4'] },
            { char: '冻', word: '冰冻', sm: 'd', ym: 'ong', tone: '4', smOpt: ['d', 't', 'b'], ymOpt: ['ong', 'eng', 'ang'], toneOpt: ['1', '2', '3', '4'] },
            { char: '第', word: '第一', sm: 'd', ym: 'i', tone: '4', smOpt: ['d', 't', 'b'], ymOpt: ['i', 'u', 'ü'], toneOpt: ['1', '2', '3', '4'] },
            { char: '像', word: '好像', sm: 'x', ym: 'iang', tone: '4', smOpt: ['x', 's', 'q'], ymOpt: ['iang', 'ian', 'ang'], toneOpt: ['1', '2', '3', '4'] },
            { char: '冷', word: '寒冷', sm: 'l', ym: 'eng', tone: '3', smOpt: ['l', 'n', 'r'], ymOpt: ['eng', 'en', 'ing'], toneOpt: ['1', '2', '3', '4'] },
            { char: '冰', word: '冰块', sm: 'b', ym: 'ing', tone: '1', smOpt: ['b', 'p', 'd'], ymOpt: ['ing', 'in', 'eng'], toneOpt: ['1', '2', '3', '4'] },
            { char: '亮', word: '明亮', sm: 'l', ym: 'iang', tone: '4', smOpt: ['l', 'n', 'r'], ymOpt: ['iang', 'ian', 'ang'], toneOpt: ['1', '2', '3', '4'] },
            { char: '种', word: '种树', sm: 'zh', ym: 'ong', tone: '4', smOpt: ['zh', 'z', 'ch'], ymOpt: ['ong', 'eng', 'ang'], toneOpt: ['1', '2', '3', '4'] },
            { char: '棵', word: '一棵', sm: 'k', ym: 'e', tone: '1', smOpt: ['k', 'g', 'h'], ymOpt: ['e', 'er', 'ei'], toneOpt: ['1', '2', '3', '4'] },
            { char: '以', word: '以后', sm: 'y', ym: 'i', tone: '3', smOpt: ['y', 'w', 'r'], ymOpt: ['i', 'ü', 'u'], toneOpt: ['1', '2', '3', '4'] },
            { char: '次', word: '一次', sm: 'c', ym: 'i', tone: '4', smOpt: ['c', 'ch', 'z'], ymOpt: ['i', 'ü', 'u'], toneOpt: ['1', '2', '3', '4'] },
            { char: '想', word: '想念', sm: 'x', ym: 'iang', tone: '3', smOpt: ['x', 's', 'q'], ymOpt: ['iang', 'ian', 'ang'], toneOpt: ['1', '2', '3', '4'] },
            { char: '邻', word: '邻居', sm: 'l', ym: 'in', tone: '2', smOpt: ['l', 'n', 'r'], ymOpt: ['in', 'ing', 'ian'], toneOpt: ['1', '2', '3', '4'] },
            { char: '居', word: '居住', sm: 'j', ym: 'ü', tone: '1', smOpt: ['j', 'q', 'x'], ymOpt: ['ü', 'u', 'i'], toneOpt: ['1', '2', '3', '4'] },
            { char: '吧', word: '好吧', sm: 'b', ym: 'a', tone: '1', smOpt: ['b', 'p', 'd'], ymOpt: ['a', 'ia', 'ua'], toneOpt: ['1', '2', '3', '4'] },
            { char: '奇', word: '奇怪', sm: 'q', ym: 'i', tone: '2', smOpt: ['q', 'j', 'x'], ymOpt: ['i', 'ü', 'u'], toneOpt: ['1', '2', '3', '4'] },
            { char: '怪', word: '奇怪', sm: 'g', ym: 'uai', tone: '4', smOpt: ['g', 'k', 'h'], ymOpt: ['uai', 'ui', 'uan'], toneOpt: ['1', '2', '3', '4'] },
            { char: '货', word: '货物', sm: 'h', ym: 'uo', tone: '4', smOpt: ['h', 'f', 'g'], ymOpt: ['uo', 'ou', 'ao'], toneOpt: ['1', '2', '3', '4'] },
            { char: '科', word: '科学', sm: 'k', ym: 'e', tone: '1', smOpt: ['k', 'g', 'h'], ymOpt: ['e', 'er', 'ei'], toneOpt: ['1', '2', '3', '4'] }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let totalQuestions = 0;

        let selectedSM = null;
        let selectedYM = null;
        let selectedTone = null;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            currentQuestions = shuffle([...wordList]);
            totalQuestions = currentQuestions.length;
            
            currentIndex = 0;
            score = 0;
            document.getElementById('progress-display').innerText = `1 / ${totalQuestions}`;
            document.getElementById('score-display').innerText = score;
            
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= totalQuestions) {
                endGame();
                return;
            }

            const q = currentQuestions[currentIndex];
            document.getElementById('progress-display').innerText = `${currentIndex + 1} / ${totalQuestions}`;
            document.getElementById('word-display').innerText = q.char;
            document.getElementById('phrase-display').innerText = `组词：${q.word}`;

            selectedSM = null;
            selectedYM = null;
            selectedTone = null;
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('feedback').classList.remove('show');

            renderOptions('shengmu-options', shuffle([...q.smOpt]), 'sm');
            renderOptions('yunmu-options', shuffle([...q.ymOpt]), 'ym');
            renderOptions('tone-options', shuffle([...q.toneOpt]), 'tone', true);
        }

        function renderOptions(containerId, options, type, isTone = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                if (isTone) {
                    const toneMap = {'1': 'ˉ', '2': 'ˊ', '3': 'ˇ', '4': 'ˋ'};
                    btn.innerText = `${opt} (${toneMap[opt]})`;
                } else {
                    btn.innerText = opt;
                }

                btn.onclick = () => {
                    const siblings = container.querySelectorAll('.option-btn');
                    siblings.forEach(s => s.classList.remove('selected'));
                    btn.classList.add('selected');
                    
                    if (type === 'sm') selectedSM = opt;
                    if (type === 'ym') selectedYM = opt;
                    if (type === 'tone') selectedTone = opt;

                    if (selectedSM && selectedYM && selectedTone) {
                        document.getElementById('submit-btn').disabled = false;
                    }
                };
                container.appendChild(btn);
            });
        }

        function checkAnswer() {
            const q = currentQuestions[currentIndex];
            const feedback = document.getElementById('feedback');
            const submitBtn = document.getElementById('submit-btn');
            
            submitBtn.disabled = true;

            if (selectedSM === q.sm && selectedYM === q.ym && selectedTone === q.tone) {
                score++;
                document.getElementById('score-display').innerText = score;
                feedback.innerText = "🎉 拼写完全正确！";
                feedback.className = "feedback correct show";
            } else {
                feedback.innerText = `💪 再接再厉！正确答案：${q.sm}-${q.ym}-${q.tone}声`;
                feedback.className = "feedback wrong show";
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1500); // 稍微缩短了等待时间，体验更顺畅
        }

        function endGame() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('end-screen').classList.add('active');

            const accuracy = (score / totalQuestions) * 100;
            let grade = 'C';
            let praise = "继续加油哦！多读多练！";
            
            if (accuracy === 100) {
                grade = 'S';
                praise = "太厉害啦！你是真正的拼音小达人！🏆";
            } else if (accuracy >= 80) {
                grade = 'A';
                praise = "非常优秀！拼音掌握得很扎实！🌟";
            } else if (accuracy >= 60) {
                grade = 'B';
                praise = "表现不错，易错音还要多加练习哦！💪";
            }

            document.getElementById('final-score').innerText = grade;
            document.getElementById('final-text').innerText = `正确率：${accuracy.toFixed(0)}% (答对 ${score} 题)`;
            document.getElementById('praise-text').innerText = praise;
        }
    </script>
</body>
</html>
